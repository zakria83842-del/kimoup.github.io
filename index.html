<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KimoUp | V5 Pro Max (AI + Notifications)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --main: #4f46e5; --bg: #f8fafc; }
        body { background-color: var(--bg); font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .kimo-gradient { background: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%); }
        .chat-pattern { background-image: url('https://www.transparenttextures.com/patterns/cubes.png'); opacity: 0.04; position: absolute; inset: 0; z-index: 0; pointer-events: none; }
        .online-dot { width: 12px; height: 12px; background-color: #22c55e; border-radius: 50%; border: 2px solid white; position: absolute; bottom: 0; right: 0; box-shadow: 0 0 5px rgba(34, 197, 94, 0.5); }
        .tab-btn { flex: 1; padding: 12px; text-align: center; font-weight: bold; color: #64748b; border-bottom: 2px solid transparent; cursor: pointer; transition: all 0.3s; }
        .tab-btn.active { color: #4f46e5; border-bottom: 2px solid #4f46e5; background: #e0e7ff; }
        /* Toast Alert Animation */
        @keyframes slideIn { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .toast { animation: slideIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="h-screen flex items-center justify-center text-gray-800 relative">

    <div id="toast-container" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-[999] flex flex-col gap-2"></div>

    <div id="auth-container" class="z-50 w-full max-w-md p-10 bg-white rounded-[2.5rem] shadow-2xl mx-4 text-center border border-gray-100 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-2 kimo-gradient"></div>
        <div class="w-24 h-24 kimo-gradient rounded-full flex items-center justify-center mx-auto mb-6 shadow-xl rotate-3 border-4 border-indigo-50">
            <i class="fa-solid fa-bolt text-white text-4xl"></i>
        </div>
        <h1 class="text-4xl font-black bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600 mb-2">KimoUp</h1>
        <p class="text-sm text-gray-400 font-bold mb-8">التواصل بذكاء وإشعارات لحظية</p>
        <div class="space-y-4 relative z-10">
            <input type="email" id="email" placeholder="البريد الإلكتروني" class="w-full p-4 bg-gray-50 rounded-2xl outline-none focus:ring-2 ring-indigo-500 text-right font-medium">
            <input type="password" id="password" placeholder="كلمة المرور" class="w-full p-4 bg-gray-50 rounded-2xl outline-none focus:ring-2 ring-indigo-500 text-right font-medium">
            <button onclick="handleSignIn()" class="w-full kimo-gradient text-white p-4 rounded-2xl font-bold shadow-lg">تسجيل الدخول</button>
            <button onclick="handleSignUp()" class="w-full p-4 text-sm text-indigo-600 font-bold">إنشاء حساب جديد</button>
        </div>
    </div>

    <div id="app-container" class="hidden w-full h-screen flex bg-white overflow-hidden">
        
        <div class="w-80 md:w-96 border-l flex flex-col bg-white z-20 shadow-2xl relative">
            <div class="p-6 bg-white border-b relative">
                <div class="absolute top-0 left-0 w-full h-1 kimo-gradient"></div>
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-black text-indigo-900 tracking-tighter">KIMO<span class="text-purple-600">UP</span></h2>
                    <div class="flex gap-2">
                        <button onclick="requestNotificationPermission()" class="w-9 h-9 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center" title="تفعيل الإشعارات"><i class="fa-solid fa-bell"></i></button>
                        <button onclick="openSettings()" class="w-9 h-9 bg-gray-100 rounded-xl flex items-center justify-center"><i class="fa-solid fa-gear"></i></button>
                        <button id="admin-btn" onclick="toggleAdminPanel()" class="hidden w-9 h-9 bg-amber-100 text-amber-600 rounded-xl flex items-center justify-center"><i class="fa-solid fa-crown"></i></button>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="relative cursor-pointer" onclick="openSettings()">
                        <img id="user-img" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="w-16 h-16 rounded-2xl object-cover shadow-md">
                        <span id="user-badge" class="absolute -top-2 -right-2 text-xl"></span>
                        <div class="online-dot"></div>
                    </div>
                    <div>
                        <p id="user-name-display" class="font-black text-lg text-gray-800">تحميل...</p>
                        <div class="bg-amber-50 px-3 py-1 rounded-lg mt-1 border border-amber-100">
                            <p id="user-x-balance" class="text-xs text-amber-600 font-black"><i class="fa-solid fa-coins mr-1"></i> X: 0</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex border-b bg-gray-50/50">
                <div id="tab-chats" class="tab-btn active" onclick="switchTab('chats')">الأصدقاء</div>
                <div id="tab-groups" class="tab-btn" onclick="switchTab('groups')">المجتمعات</div>
            </div>

            <div class="p-4 bg-white border-b" id="sidebar-action-area"></div>
            <div id="contacts-list" class="flex-1 overflow-y-auto bg-white"></div>
            <div id="groups-list" class="flex-1 overflow-y-auto bg-white hidden"></div>
            <button onclick="handleSignOut()" class="p-4 text-xs text-red-500 font-bold border-t">تسجيل الخروج</button>
        </div>

        <div class="flex-1 flex flex-col relative bg-gray-50">
            <div class="chat-pattern"></div>
            <div id="welcome-screen" class="absolute inset-0 flex flex-col items-center justify-center text-gray-400 z-10 backdrop-blur-sm bg-white/50">
                <h2 class="text-2xl font-black text-gray-800">أهلاً بك في KimoUp</h2>
                <p class="mt-2 text-sm">اختر صديق للبدء أو اسأل كيمو AI</p>
            </div>

            <div id="chat-ui" class="hidden h-full flex flex-col relative z-10">
                <div class="p-4 bg-white/95 backdrop-blur-md shadow-sm flex justify-between items-center px-6 border-b z-20">
                    <div class="flex items-center gap-4">
                        <img id="target-img" src="" class="w-12 h-12 rounded-2xl object-cover border border-gray-100">
                        <div>
                            <h3 id="target-name" class="font-black text-gray-800 text-lg">...</h3>
                            <p id="target-subtitle" class="text-xs text-indigo-500 font-bold">متصل الآن</p>
                        </div>
                    </div>
                </div>

                <div id="messages-area" class="flex-1 p-6 overflow-y-auto flex flex-col gap-3"></div>

                <div id="chat-input-area" class="p-4 bg-white border-t relative z-20 flex flex-col gap-2 shadow-lg">
                    <div class="flex gap-3 items-end px-4">
                        <div class="flex-1 relative bg-gray-50 rounded-2xl border border-gray-100">
                            <textarea id="msg-input" placeholder="اكتب رسالتك أو اسأل AI بكتابة كلمة (كيمو)..." class="w-full p-4 bg-transparent outline-none resize-none" rows="1"></textarea>
                        </div>
                        <button onclick="sendMessage()" class="w-14 h-14 kimo-gradient text-white rounded-2xl shadow-lg flex items-center justify-center hover:scale-105 transition-transform">
                            <i class="fa-solid fa-paper-plane text-xl"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="admin-panel" class="hidden fixed inset-0 bg-slate-900/40 z-[200] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white p-8 rounded-[2rem] w-full max-w-md shadow-2xl relative">
            <h2 class="text-2xl font-black mb-6 text-amber-600">لوحة الإدارة 👑</h2>
            <div class="space-y-4">
                <input type="text" id="admin-user" placeholder="إيميل المستخدم" class="w-full p-4 bg-gray-50 rounded-2xl outline-none">
                <input type="number" id="admin-amount" placeholder="كمية الـ X" class="w-full p-4 bg-gray-50 rounded-2xl outline-none">
                <button onclick="adminAction('coins')" class="w-full bg-amber-500 text-white p-4 rounded-2xl font-bold shadow-lg">شحن الرصيد</button>
                <button onclick="closeModals()" class="w-full p-4 bg-gray-100 rounded-2xl">إغلاق</button>
            </div>
        </div>
    </div>

    <div id="modal-settings" class="hidden fixed inset-0 bg-slate-900/40 z-[200] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white p-8 rounded-[2rem] w-full max-w-md shadow-2xl relative">
            <h2 class="text-2xl font-black mb-6">إعدادات الحساب</h2>
            <div class="space-y-4">
                <input type="text" id="set-name" placeholder="اسمك الجديد" class="w-full p-4 bg-gray-50 rounded-2xl outline-none">
                <input type="text" id="set-badge" placeholder="إيموجي اللقب (مثال: 👑)" class="w-full p-4 bg-gray-50 rounded-2xl outline-none text-center text-xl">
                <button onclick="updateProfile()" class="w-full kimo-gradient text-white p-4 rounded-2xl font-bold">حفظ التغييرات</button>
                <button onclick="closeModals()" class="w-full p-4 bg-gray-100 rounded-2xl">إلغاء</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, addDoc, serverTimestamp, query, orderBy, onSnapshot, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // إعدادات قاعدة البيانات الخاصة بك
        const firebaseConfig = { 
            apiKey: "AIzaSyDEF8YAXmkV5t7scY1St2GDliQueOXGEsc", 
            authDomain: "telekimo-36af6.firebaseapp.com", 
            projectId: "telekimo-36af6", 
            appId: "1:430737934562:web:22eb31d1fd4742826776bb" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let activeChat = null;
        let chatType = 'direct';
        let currentTab = 'chats';
        let activeSnapshotUnsubscribe = null;
        let base64Avatar = null;
        let appLoadTime = Date.now(); // عشان الإشعارات متتبعتش للرسائل القديمة

        // ==========================================
        // 1. نظام الإشعارات الذكي (Web Notifications)
        // ==========================================
        window.requestNotificationPermission = () => {
            if (!("Notification" in window)) {
                showToast("متصفحك لا يدعم الإشعارات", "error");
            } else if (Notification.permission === "granted") {
                showToast("الإشعارات مفعلة بالفعل 🔔", "success");
            } else if (Notification.permission !== "denied") {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") showToast("تم تفعيل الإشعارات بنجاح! 🔔", "success");
                });
            }
        };

        function triggerNotification(title, body) {
            // لو المتصفح مصرح له، والصفحة مش مفتوحة قدام اليوزر حالاً (يعني بيعمل حاجة تانية)
            if (Notification.permission === "granted" && document.hidden) {
                const notif = new Notification(title, {
                    body: body,
                    icon: "https://cdn-icons-png.flaticon.com/512/4712/4712139.png" // أيقونة كيمو
                });
                
                // تشغيل صوت الإشعار
                const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
                audio.play().catch(e => console.log("الصوت محتاج تفاعل أولاً"));

                notif.onclick = () => { window.focus(); };
            }
        }

        // ==========================================
        // 2. نظام الذكاء الاصطناعي (Kimo AI)
        // ==========================================
        async function askKimoAI(userQuestion) {
            const apiKey = "gsk_XlA971fOfg7vSHe7BskhWGdyb3FYpZkOfX1pG7vSHe7BskhW"; 
            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "llama3-8b-8192",
                        messages: [
                            { role: "system", content: "أنت كيمو AI، مساعد ذكي ومرح، ترد باختصار شديد وبالعامية المصرية." }, 
                            { role: "user", content: userQuestion }
                        ]
                    })
                });
                const data = await response.json();
                const aiReply = data.choices[0].message.content;
                
                const parent = chatType === 'group' ? 'groups' : 'chats';
                const id = chatType === 'group' ? activeChat.id : [currentUser.email, activeChat.email].sort().join('_');
                
                await addDoc(collection(db, parent, id, "messages"), {
                    type: 'text',
                    text: "🤖 كيمو AI: " + aiReply,
                    sender: "kimo-ai",
                    senderName: "كيمو AI",
                    time: serverTimestamp()
                });
            } catch (e) { console.error("AI Error", e); }
        }

        // ==========================================
        // 3. المنطق الأساسي للتطبيق (المطابق للماستر)
        // ==========================================
        window.showToast = (msg, type = 'info') => {
            const t = document.createElement('div');
            t.className = `toast p-3 rounded-xl text-white font-bold text-sm shadow-xl ${type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-green-500' : 'bg-indigo-500'}`;
            t.innerText = msg;
            document.getElementById('toast-container').appendChild(t);
            setTimeout(() => t.remove(), 3000);
        };

        window.handleSignIn = async () => {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                requestNotificationPermission(); // نطلب تفعيل الإشعارات وقت الدخول
            } catch (e) { showToast("خطأ في تسجيل الدخول", "error"); }
        };

        window.handleSignUp = async () => {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;
            try { await createUserWithEmailAndPassword(auth, email, pass); } 
            catch (e) { showToast("خطأ في إنشاء الحساب", "error"); }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userRef = doc(db, "users", user.email);
                const snap = await getDoc(userRef);
                if (!snap.exists()) {
                    await setDoc(userRef, { email: user.email, name: user.email.split('@')[0], xCoins: 100, contacts: [] });
                }
                
                onSnapshot(userRef, (docSnap) => {
                    currentUser = { email: docSnap.id, ...docSnap.data() };
                    document.getElementById('user-name-display').innerText = currentUser.name;
                    document.getElementById('user-x-balance').innerText = `X: ${currentUser.xCoins || 0}`;
                    if(currentUser.badge) document.getElementById('user-badge').innerText = currentUser.badge;
                    if(currentUser.avatar) document.getElementById('user-img').src = currentUser.avatar;
                    
                    // لو أنت أدمن (حط إيميلك هنا)
                    if(currentUser.email === "admin@kimo.com") document.getElementById('admin-btn').classList.remove('hidden');

                    document.getElementById('auth-container').classList.add('hidden');
                    document.getElementById('app-container').classList.remove('hidden');
                    renderSidebar();
                });
            } else {
                document.getElementById('auth-container').classList.remove('hidden');
                document.getElementById('app-container').classList.add('hidden');
            }
        });

        window.sendMessage = async () => {
            const el = document.getElementById('msg-input');
            const txt = el.value.trim();
            if (!txt || !activeChat) return;
            el.value = "";
            
            const parent = chatType === 'group' ? 'groups' : 'chats';
            const id = chatType === 'group' ? activeChat.id : [currentUser.email, activeChat.email].sort().join('_');
            
            // إرسال الرسالة العادية
            await addDoc(collection(db, parent, id, "messages"), {
                type: 'text', text: txt, sender: currentUser.email, senderName: currentUser.name, time: serverTimestamp()
            });

            // لو الرسالة فيها "كيمو" أو "ai"، شغل الذكاء الاصطناعي
            if (txt.toLowerCase().includes("كيمو") || txt.toLowerCase().includes("ai")) {
                await askKimoAI(txt);
            }
        };

        function loadMessages(id, parent) {
            if (activeSnapshotUnsubscribe) activeSnapshotUnsubscribe();
            const q = query(collection(db, parent, id, "messages"), orderBy("time", "asc"));
            
            activeSnapshotUnsubscribe = onSnapshot(q, (snap) => {
                const area = document.getElementById('messages-area');
                area.innerHTML = "";
                
                snap.docChanges().forEach(change => {
                    if (change.type === "added") {
                        const m = change.doc.data();
                        
                        // ===== نظام الإشعارات =====
                        // لو الرسالة مش مني، ووقتها أجدد من وقت فتح التطبيق، ابعت إشعار
                        if (m.sender !== currentUser.email && m.time && m.time.toMillis() > appLoadTime) {
                            triggerNotification(m.senderName, m.text);
                        }
                    }
                });

                snap.forEach(d => {
                    const m = d.data();
                    const isMe = m.sender === currentUser.email;
                    const isAI = m.sender === "kimo-ai";
                    
                    const div = document.createElement('div');
                    let classes = isMe ? 'self-end bg-indigo-600 text-white' : isAI ? 'self-start bg-gradient-to-r from-purple-500 to-pink-500 text-white border border-pink-300' : 'self-start bg-white border border-gray-100 shadow-sm';
                    div.className = `p-4 rounded-2xl max-w-[80%] ${classes} ${isMe ? 'rounded-br-none' : 'rounded-bl-none'}`;
                    
                    div.innerHTML = `<p class="text-[10px] opacity-70 mb-1 font-bold">${m.senderName}</p><p class="text-sm leading-relaxed">${m.text}</p>`;
                    area.appendChild(div);
                });
                area.scrollTop = area.scrollHeight;
            });
        }

        window.openChat = (target, type) => {
            activeChat = target;
            chatType = type;
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('chat-ui').classList.remove('hidden');
            document.getElementById('target-name').innerText = target.name;
            if(target.avatar) document.getElementById('target-img').src = target.avatar;
            
            const id = type === 'group' ? target.id : [currentUser.email, target.email].sort().join('_');
            loadMessages(id, type === 'group' ? 'groups' : 'chats');
        };

        window.switchTab = (tab) => {
            currentTab = tab;
            document.getElementById('tab-chats').classList.toggle('active', tab === 'chats');
            document.getElementById('tab-groups').classList.toggle('active', tab === 'groups');
            document.getElementById('contacts-list').classList.toggle('hidden', tab !== 'chats');
            document.getElementById('groups-list').classList.toggle('hidden', tab !== 'groups');
            renderSidebar();
        };

        async function renderSidebar() {
            const container = document.getElementById('contacts-list');
            container.innerHTML = "";
            (currentUser.contacts || []).forEach(async email => {
                const d = await getDoc(doc(db, "users", email));
                if (d.exists()) {
                    const div = document.createElement('div');
                    div.className = "p-4 border-b cursor-pointer hover:bg-gray-50 flex items-center gap-3 transition-colors";
                    div.innerHTML = `<img src="${d.data().avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" class="w-10 h-10 rounded-xl object-cover"> <p class="font-bold">${d.data().name}</p>`;
                    div.onclick = () => openChat({email, ...d.data()}, 'direct');
                    container.appendChild(div);
                }
            });
            
            document.getElementById('sidebar-action-area').innerHTML = `<button onclick="const e=prompt('إيميل الصديق:'); if(e) { updateDoc(doc(db,'users',currentUser.email),{contacts:arrayUnion(e)}); showToast('تمت الإضافة', 'success'); }" class="w-full p-3 bg-indigo-50 rounded-xl text-indigo-600 text-sm font-bold shadow-sm hover:bg-indigo-100 transition-all">+ إضافة صديق</button>`;
        }

        // تحكمات الواجهة المتبقية
        window.openSettings = () => { document.getElementById('modal-settings').classList.remove('hidden'); };
        window.toggleAdminPanel = () => { document.getElementById('admin-panel').classList.remove('hidden'); };
        window.closeModals = () => document.querySelectorAll('[id^="modal-"], #admin-panel').forEach(m => m.classList.add('hidden'));
        window.handleSignOut = () => signOut(auth);

        window.updateProfile = async () => {
            const name = document.getElementById('set-name').value;
            const badge = document.getElementById('set-badge').value;
            await updateDoc(doc(db, "users", currentUser.email), { name, badge });
            closeModals();
            showToast("تم تحديث البروفايل!", "success");
        };

        window.adminAction = async (type) => {
            const email = document.getElementById('admin-user').value.trim();
            const ref = doc(db, "users", email);
            const snap = await getDoc(ref);
            if(!snap.exists()) return showToast("المستخدم غير موجود", "error");

            if(type === 'coins') {
                const val = parseInt(document.getElementById('admin-amount').value);
                await updateDoc(ref, { xCoins: (snap.data().xCoins || 0) + val });
                showToast(`تم شحن ${val} لـ ${email}`, "success");
                closeModals();
            }
        };

        // تفعيل الإنتر لإرسال الرسالة
        document.getElementById('msg-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });

    </script>
</body>
</html>
