<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KimoUp Ultimate V6 | AI & Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --main: #6366f1; --premium: #f59e0b; }
        body { background: #0f172a; font-family: 'Segoe UI', system-ui; color: white; height: 100vh; overflow: hidden; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .kimo-gradient { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
        .premium-border { border: 2px solid var(--premium); position: relative; }
        .premium-badge { background: var(--premium); color: black; font-weight: 900; font-size: 10px; padding: 2px 6px; border-radius: 4px; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); }
        
        /* Animations */
        @keyframes pulse-gold { 0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); } 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); } }
        .premium-active { animation: pulse-gold 2s infinite; }
        
        .msg-bubble { max-width: 80%; padding: 12px 16px; border-radius: 20px; margin-bottom: 8px; position: relative; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .ai-loading { display: flex; gap: 4px; padding: 10px; }
        .dot { width: 8px; height: 8px; background: #818cf8; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="toast-layer" class="fixed top-5 left-1/2 -translate-x-1/2 z-[1000] flex flex-col gap-2"></div>

    <div id="auth-screen" class="fixed inset-0 z-[500] flex items-center justify-center bg-slate-950 px-4">
        <div class="glass-panel p-10 rounded-[3rem] w-full max-w-md text-center shadow-2xl border-t-4 border-indigo-500">
            <div class="w-20 h-20 kimo-gradient rounded-3xl flex items-center justify-center mx-auto mb-6 rotate-12 shadow-indigo-500/20 shadow-2xl">
                <i class="fa-solid fa-robot text-white text-4xl"></i>
            </div>
            <h1 class="text-3xl font-black mb-2 tracking-tight">KIMO<span class="text-indigo-400">UP</span> AI</h1>
            <p class="text-slate-400 text-sm mb-8 font-medium">الجيل السادس من التواصل الذكي</p>
            
            <div class="space-y-4">
                <input type="email" id="email" placeholder="البريد الإلكتروني" class="w-full p-4 bg-slate-800/50 rounded-2xl outline-none focus:ring-2 ring-indigo-500 border border-slate-700 transition">
                <input type="password" id="pass" placeholder="كلمة المرور" class="w-full p-4 bg-slate-800/50 rounded-2xl outline-none focus:ring-2 ring-indigo-500 border border-slate-700 transition">
                <button onclick="authAction('in')" class="w-full kimo-gradient p-4 rounded-2xl font-black shadow-lg hover:scale-[1.02] transition active:scale-95">دخول</button>
                <button onclick="authAction('up')" class="w-full text-slate-400 text-xs font-bold hover:text-white transition">ليس لديك حساب؟ سجل الآن</button>
            </div>
        </div>
    </div>

    <div id="main-app" class="hidden h-screen flex overflow-hidden">
        
        <div class="w-80 border-l border-slate-800 flex flex-col glass-panel">
            <div class="p-6 border-b border-slate-800">
                <div class="flex items-center justify-between mb-6">
                    <span class="font-black text-xl italic">V6.0</span>
                    <button onclick="toggleAdmin()" id="admin-btn" class="hidden text-amber-500"><i class="fa-solid fa-crown"></i></button>
                </div>
                
                <div class="flex items-center gap-4 p-4 bg-slate-800/40 rounded-3xl border border-slate-700/50">
                    <div class="relative">
                        <img id="u-avatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="w-14 h-14 rounded-2xl object-cover shadow-lg">
                        <div id="u-premium-tag" class="hidden absolute -top-2 -right-2 w-6 h-6 bg-amber-500 rounded-full flex items-center justify-center text-[10px] text-black"><i class="fa-solid fa-star"></i></div>
                    </div>
                    <div class="overflow-hidden">
                        <p id="u-name" class="font-bold truncate text-sm">تحميل...</p>
                        <div class="flex items-center gap-2 mt-1">
                            <span class="text-[10px] bg-indigo-500/20 text-indigo-400 px-2 py-0.5 rounded-full font-bold">X: <span id="u-coins">0</span></span>
                            <span id="ai-counter-label" class="text-[10px] bg-slate-700 text-slate-300 px-2 py-0.5 rounded-full font-bold">AI: <span id="u-ai-count">0</span>/10</span>
                        </div>
                    </div>
                </div>
            </div>

            <div id="sidebar-list" class="flex-1 overflow-y-auto p-4 space-y-2">
                <div onclick="startAIChat()" class="flex items-center gap-3 p-4 rounded-2xl bg-indigo-600/20 border border-indigo-500/30 cursor-pointer hover:bg-indigo-600/30 transition group">
                    <div class="w-10 h-10 kimo-gradient rounded-xl flex items-center justify-center shadow-lg group-hover:rotate-12 transition">
                        <i class="fa-solid fa-wand-magic-sparkles text-white"></i>
                    </div>
                    <div>
                        <p class="font-black text-sm text-indigo-300">كيمو AI (Vision)</p>
                        <p class="text-[10px] text-indigo-400/70">اسألني أي شيء أو ارفع صورة</p>
                    </div>
                </div>
                <div class="h-px bg-slate-800 my-4"></div>
                <div id="contacts-container" class="space-y-1"></div>
            </div>

            <button onclick="logout()" class="p-6 text-slate-500 hover:text-red-400 transition text-sm font-bold flex items-center justify-center gap-2 border-t border-slate-800">
                <i class="fa-solid fa-power-off"></i> تسجيل الخروج
            </button>
        </div>

        <div class="flex-1 flex flex-col relative">
            
            <div id="chat-header" class="hidden p-5 border-b border-slate-800 flex justify-between items-center glass-panel z-10">
                <div class="flex items-center gap-4">
                    <img id="chat-avatar" class="w-12 h-12 rounded-2xl object-cover border border-slate-700">
                    <div>
                        <h3 id="chat-title" class="font-black text-lg">...</h3>
                        <p id="chat-status" class="text-[10px] text-indigo-400 font-bold uppercase tracking-widest">Online</p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="upgradePrompt()" id="upgrade-btn" class="hidden bg-amber-500/10 text-amber-500 px-4 py-2 rounded-xl text-xs font-black border border-amber-500/20 hover:bg-amber-500 hover:text-black transition">ترقية للبريميوم 👑</button>
                    <button class="w-10 h-10 bg-slate-800 rounded-xl flex items-center justify-center hover:bg-slate-700"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                </div>
            </div>

            <div id="msg-box" class="flex-1 overflow-y-auto p-6 flex flex-col gap-4 scroll-smooth">
                <div class="m-auto text-center opacity-20 pointer-events-none">
                    <i class="fa-solid fa-shield-cat text-9xl mb-4"></i>
                    <h2 class="text-2xl font-black italic">KIMO UP ULTIMATE</h2>
                </div>
            </div>

            <div id="ai-typing" class="hidden px-8 py-2">
                <div class="ai-loading">
                    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                </div>
            </div>

            <div id="input-area" class="hidden p-6 glass-panel border-t border-slate-800 relative">
                
                <div id="image-preview-box" class="hidden absolute bottom-full left-6 mb-4 p-2 bg-slate-800 rounded-2xl border border-indigo-500/50 shadow-2xl">
                    <img id="img-prev" class="w-32 h-32 object-cover rounded-xl border border-slate-700">
                    <button onclick="clearImage()" class="absolute -top-2 -right-2 w-6 h-6 bg-red-500 rounded-full text-[10px] flex items-center justify-center shadow-lg"><i class="fa-solid fa-times"></i></button>
                </div>

                <div class="flex items-end gap-3 max-w-5xl mx-auto">
                    <label class="w-14 h-14 bg-slate-800 rounded-2xl flex items-center justify-center cursor-pointer hover:bg-slate-700 transition shadow-xl text-indigo-400">
                        <i class="fa-solid fa-camera-retro text-xl"></i>
                        <input type="file" id="file-input" class="hidden" accept="image/*" onchange="handleImage(this)">
                    </label>
                    
                    <div class="flex-1 relative">
                        <textarea id="msg-input" placeholder="اسأل كيمو AI أو دردش مع صديق..." class="w-full bg-slate-800/50 border border-slate-700 p-4 pr-6 rounded-[1.5rem] outline-none focus:ring-2 ring-indigo-500/50 transition min-h-[56px] max-h-40 resize-none text-sm leading-relaxed" rows="1"></textarea>
                    </div>

                    <button id="record-btn" class="w-14 h-14 bg-slate-800 text-slate-400 rounded-2xl flex items-center justify-center hover:bg-indigo-600 hover:text-white transition shadow-xl">
                        <i class="fa-solid fa-microphone text-xl"></i>
                    </button>
                    
                    <button onclick="handleSend()" class="w-14 h-14 kimo-gradient text-white rounded-2xl flex items-center justify-center shadow-indigo-500/30 shadow-xl hover:scale-105 transition active:scale-95">
                        <i class="fa-solid fa-paper-plane-top text-xl"></i>
                        <i class="fa-solid fa-bolt text-xl"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, collection, addDoc, serverTimestamp, query, orderBy, limit, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Firebase Config
        const firebaseConfig = { 
            apiKey: "AIzaSyDEF8YAXmkV5t7scY1St2GDliQueOXGEsc", 
            authDomain: "telekimo-36af6.firebaseapp.com", 
            projectId: "telekimo-36af6", 
            appId: "1:430737934562:web:22eb31d1fd4742826776bb" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Constants
        const GROQ_API_KEY = "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";
        const AI_EMAIL = "KimoAI@system";
        const PREMIUM_COST = 500; // سعر الترقية بالعملات

        let currentUser = null;
        let activeChat = null;
        let currentBase64Image = null;
        let isAIBusy = false;

        // ---------------------------------------------------------
        // 1. Auth & Profile Sync
        // ---------------------------------------------------------
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userRef = doc(db, "users", user.email);
                const snap = await getDoc(userRef);
                if (!snap.exists()) {
                    await setDoc(userRef, { 
                        email: user.email, name: user.email.split('@')[0], 
                        xCoins: 100, aiUsage: 0, isPremium: false, avatar: "" 
                    });
                }
                
                onSnapshot(userRef, (d) => {
                    currentUser = d.data();
                    updateProfileUI();
                    renderSidebar();
                });

                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('main-app').classList.remove('hidden');
                if (user.email === "kareemwael0216@gmail.com") document.getElementById('admin-btn').classList.remove('hidden');
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('main-app').classList.add('hidden');
            }
        });

        window.authAction = async (type) => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            try {
                if(type === 'in') await signInWithEmailAndPassword(auth, e, p);
                else await createUserWithEmailAndPassword(auth, e, p);
            } catch(err) { toast(err.message, "error"); }
        };

        function updateProfileUI() {
            document.getElementById('u-name').innerText = currentUser.name;
            document.getElementById('u-coins').innerText = currentUser.xCoins;
            document.getElementById('u-ai-count').innerText = currentUser.aiUsage;
            document.getElementById('u-avatar').src = currentUser.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
            
            const aiLabel = document.getElementById('ai-counter-label');
            if (currentUser.isPremium) {
                aiLabel.innerHTML = "PREMIUM ♾️";
                aiLabel.className = "text-[10px] bg-amber-500 text-black px-2 py-0.5 rounded-full font-black";
                document.getElementById('u-premium-tag').classList.remove('hidden');
            }
        }

        // ---------------------------------------------------------
        // 2. AI & Vision Logic
        // ---------------------------------------------------------
        async function callGroqAI(userPrompt, base64Image = null) {
            // Check Limits
            if (!currentUser.isPremium && currentUser.aiUsage >= 10) {
                return "لقد استنفدت محاولاتك المجانية (10/10). برجاء الترقية للحصول على عدد غير محدود من الأسئلة!";
            }

            const messages = [
                { role: "system", content: "أنت كيمو AI، المساعد الذكي الرسمي لتطبيق KimoUp. رد بذكاء وبطريقة ممتعة باللغة العربية. لو المستخدم أرسل صورة، حللها بدقة." }
            ];

            if (base64Image) {
                messages.push({
                    role: "user",
                    content: [
                        { type: "text", text: userPrompt || "ماذا يوجد في هذه الصورة؟" },
                        { type: "image_url", image_url: { url: base64Image } }
                    ]
                });
            } else {
                messages.push({ role: "user", content: userPrompt });
            }

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${GROQ_API_KEY}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: base64Image ? "llama-3.2-11b-vision-preview" : "llama3-8b-8192",
                        messages: messages,
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                
                // Update Usage Counter
                if (!currentUser.isPremium) {
                    await updateDoc(doc(db, "users", currentUser.email), { aiUsage: currentUser.aiUsage + 1 });
                }

                return data.choices[0].message.content;
            } catch (err) {
                console.error(err);
                return "عذراً يا بطل، حصل خطأ في الاتصال بالسيرفر. تأكد من الـ API Key.";
            }
        }

        // ---------------------------------------------------------
        // 3. Chat Core
        // ---------------------------------------------------------
        window.startAIChat = () => {
            activeChat = { email: AI_EMAIL, name: "كيمو AI (Vision)", avatar: "" };
            setupChatUI();
            loadMessages(getChatId(AI_EMAIL));
        };

        function setupChatUI() {
            document.getElementById('chat-header').classList.remove('hidden');
            document.getElementById('input-area').classList.remove('hidden');
            document.getElementById('chat-title').innerText = activeChat.name;
            document.getElementById('chat-avatar').src = activeChat.avatar || 'https://cdn-icons-png.flaticon.com/512/4712/4712139.png';
            
            const upBtn = document.getElementById('upgrade-btn');
            if (!currentUser.isPremium) upBtn.classList.remove('hidden');
            else upBtn.classList.add('hidden');
        }

        window.handleSend = async () => {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text && !currentBase64Image) return;

            const tempText = text;
            const tempImg = currentBase64Image;

            input.value = "";
            clearImage();
            
            // 1. Save User Message
            await saveMsg(currentUser.email, tempText, tempImg);

            // 2. Handle AI Reply if chatting with AI
            if (activeChat.email === AI_EMAIL) {
                document.getElementById('ai-typing').classList.remove('hidden');
                const reply = await callGroqAI(tempText, tempImg);
                document.getElementById('ai-typing').classList.add('hidden');
                await saveMsg(AI_EMAIL, reply);
                speak(reply); // نطق الرد
            }
        };

        async function saveMsg(sender, text, img = null) {
            const chatId = getChatId(activeChat.email);
            await addDoc(collection(db, "chats", chatId, "messages"), {
                sender, text, img, time: serverTimestamp()
            });
        }

        function loadMessages(chatId) {
            const q = query(collection(db, "chats", chatId, "messages"), orderBy("time", "asc"), limit(50));
            onSnapshot(q, (snap) => {
                const box = document.getElementById('msg-box');
                box.innerHTML = "";
                snap.forEach(doc => {
                    const m = doc.data();
                    const isMe = m.sender === currentUser.email;
                    const div = document.createElement('div');
                    div.className = isMe ? "self-end" : "self-start";
                    
                    div.innerHTML = `
                        <div class="msg-bubble ${isMe ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-slate-800 text-slate-100 rounded-bl-none border border-slate-700 shadow-xl'}">
                            ${m.img ? `<img src="${m.img}" class="w-64 h-auto rounded-xl mb-2 border border-white/10">` : ''}
                            <p class="text-sm leading-relaxed">${m.text}</p>
                        </div>
                    `;
                    box.appendChild(div);
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        // ---------------------------------------------------------
        // 4. Premium & Helpers
        // ---------------------------------------------------------
        window.upgradePrompt = async () => {
            if (currentUser.xCoins < PREMIUM_COST) {
                toast(`تحتاج لـ ${PREMIUM_COST} عملة للترقية. رصيدك الحالي: ${currentUser.xCoins}`, "error");
                return;
            }
            if (confirm(`هل تريد الترقية للبريميوم مقابل ${PREMIUM_COST} عملة؟ ستحصل على ذكاء اصطناعي بلا حدود!`)) {
                await updateDoc(doc(db, "users", currentUser.email), {
                    isPremium: true,
                    xCoins: currentUser.xCoins - PREMIUM_COST
                });
                confetti({ particleCount: 200, spread: 70, origin: { y: 0.6 } });
                toast("مبروك! أنت الآن مستخدم بريميوم 👑", "success");
            }
        };

        window.handleImage = (input) => {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    currentBase64Image = e.target.result;
                    document.getElementById('image-preview-box').classList.remove('hidden');
                    document.getElementById('img-prev').src = currentBase64Image;
                };
                reader.readAsDataURL(file);
            }
        };

        window.clearImage = () => {
            currentBase64Image = null;
            document.getElementById('image-preview-box').classList.add('hidden');
            document.getElementById('file-input').value = "";
        };

        function getChatId(target) {
            return [currentUser.email, target].sort().join("_");
        }

        function toast(m, type = 'info') {
            const l = document.getElementById('toast-layer');
            const d = document.createElement('div');
            d.className = `p-4 rounded-2xl shadow-2xl text-xs font-bold border ${type === 'error' ? 'bg-red-500/20 border-red-500 text-red-400' : 'bg-indigo-500/20 border-indigo-500 text-indigo-300'} animate-bounce`;
            d.innerText = m;
            l.appendChild(d);
            setTimeout(() => d.remove(), 4000);
        }

        function speak(text) {
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'ar-SA';
            window.speechSynthesis.speak(msg);
        }

        // Sidebar rendering
        async function renderSidebar() {
            const cont = document.getElementById('contacts-container');
            cont.innerHTML = "";
            (currentUser.contacts || []).forEach(email => {
                const div = document.createElement('div');
                div.className = "p-3 rounded-xl hover:bg-slate-800 cursor-pointer text-sm font-medium transition";
                div.innerText = email;
                div.onclick = () => {
                    activeChat = { email, name: email.split('@')[0] };
                    setupChatUI();
                    loadMessages(getChatId(email));
                };
                cont.appendChild(div);
            });
        }
    </script>
</body>
</html>
