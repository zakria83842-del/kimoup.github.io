<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeleKimo | Official Auth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --tg-primary: #0088cc; --tg-bg: #f0f2f5; }
        body { background-color: var(--tg-bg); font-family: sans-serif; overflow: hidden; }
        .chat-pattern { background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); opacity: 0.08; position: absolute; inset: 0; z-index: 0; }
        .glass-effect { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .animated-emoji { display: inline-block; animation: bounce 1.5s infinite ease-in-out; font-size: 1.5rem; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body class="h-screen flex items-center justify-center">

    <div id="auth-container" class="z-50 w-full max-w-md p-8 bg-white rounded-3xl shadow-2xl mx-4">
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-[#0088cc] rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg text-white text-4xl">
                <i class="fa-brands fa-telegram"></i>
            </div>
            <h1 class="text-3xl font-black text-gray-800">TeleKimo</h1>
            <p id="auth-status" class="text-gray-500 mt-2">سجل دخولك للبدء</p>
        </div>

        <div class="space-y-4">
            <input type="email" id="email" placeholder="البريد الإلكتروني" class="w-full p-4 border rounded-2xl outline-none focus:ring-2 ring-blue-400">
            <input type="password" id="password" placeholder="كلمة المرور" class="w-full p-4 border rounded-2xl outline-none focus:ring-2 ring-blue-400">
            
            <div class="flex gap-2">
                <button onclick="handleSignIn()" class="flex-1 bg-[#0088cc] text-white p-4 rounded-2xl font-bold hover:bg-blue-600 transition">دخول</button>
                <button onclick="handleSignUp()" class="flex-1 bg-gray-100 text-gray-700 p-4 rounded-2xl font-bold hover:bg-gray-200 transition">تسجيل جديد</button>
            </div>
            <p class="text-[10px] text-center text-gray-400">عند التسجيل الجديد، سيصلك رابط توثيق على إيميلك</p>
        </div>
    </div>

    <div id="app-container" class="hidden w-full h-screen flex bg-white overflow-hidden">
        <div class="w-80 border-l flex flex-col bg-white z-10 shadow-xl">
            <div class="p-5 bg-[#0088cc] text-white flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center font-bold" id="user-initial">U</div>
                    <div>
                        <p id="user-name" class="font-bold text-sm">User</p>
                        <p id="user-coins" class="text-[10px] text-yellow-300 font-bold">X: 0</p>
                    </div>
                </div>
                <button onclick="toggleAdminPanel()" id="admin-btn" class="hidden text-xl"><i class="fa-solid fa-user-shield"></i></button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-2" id="users-list">
                </div>

            <div class="p-4 border-t gap-2 flex flex-col">
                <button onclick="showPremiumModal()" class="w-full py-3 rounded-xl bg-gradient-to-r from-yellow-400 to-yellow-600 text-white font-bold shadow-lg">طلب Premium ⭐</button>
                <button onclick="handleSignOut()" class="text-xs text-red-400 font-medium">تسجيل الخروج</button>
            </div>
        </div>

        <div class="flex-1 flex flex-col relative bg-[#e5e7eb]">
            <div class="chat-pattern"></div>
            <div id="chat-welcome" class="absolute inset-0 flex items-center justify-center z-10 text-gray-400 flex-col">
                <i class="fa-regular fa-comments text-6xl mb-4"></i>
                <p>اختر صديقاً لبدء المحادثة</p>
            </div>

            <div id="active-chat-ui" class="hidden h-full flex flex-col z-10">
                <div class="p-4 glass-effect border-b flex justify-between items-center shadow-sm">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 font-bold" id="target-initial">?</div>
                        <h3 id="target-name" class="font-bold">Chat</h3>
                    </div>
                </div>

                <div id="msg-box" class="flex-1 p-6 overflow-y-auto flex flex-col gap-3"></div>

                <div class="p-4 glass-effect flex gap-3 items-center">
                    <input type="text" id="msg-input" placeholder="اكتب رسالة..." class="flex-1 p-4 rounded-2xl border-none shadow-inner outline-none focus:ring-2 ring-blue-500">
                    <button onclick="sendMsg()" class="w-14 h-14 bg-[#0088cc] text-white rounded-2xl flex items-center justify-center shadow-lg hover:scale-105 transition"><i class="fa-solid fa-paper-plane text-xl"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-premium" class="hidden fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-[2rem] max-w-sm w-full text-center">
            <h2 class="text-2xl font-black mb-4">تفعيل البريميوم</h2>
            <p class="text-gray-500 mb-6 text-sm">لتفعيل حسابك أو شحن X Coins، تواصل مع الأدمن:</p>
            <div class="bg-blue-50 p-5 rounded-2xl mb-6">
                <p class="text-2xl font-bold text-[#0088cc]">01112215950</p>
            </div>
            <button onclick="closeModals()" class="w-full p-4 bg-gray-100 rounded-2xl font-bold">حسناً</button>
        </div>
    </div>

    <div id="modal-admin" class="hidden fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-[2rem] max-w-md w-full">
            <h2 class="text-xl font-bold mb-4">لوحة تحكم كيمو 👑</h2>
            <input type="email" id="admin-target" placeholder="إيميل المستخدم" class="w-full p-3 border rounded-xl mb-3">
            <div class="flex gap-2 mb-3">
                <input type="number" id="admin-coins" placeholder="إضافة X" class="flex-1 p-3 border rounded-xl">
                <button onclick="adminAction('coins')" class="bg-yellow-500 text-white px-6 rounded-xl">شحن</button>
            </div>
            <button onclick="adminAction('premium')" class="w-full bg-blue-600 text-white p-4 rounded-xl font-bold mb-2">تفعيل بريميوم فوراً</button>
            <button onclick="closeModals()" class="w-full text-gray-400">إلغاء</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, sendEmailVerification, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, query, orderBy, onSnapshot, addDoc, serverTimestamp, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyDEF8YAXmkV5t7scY1St2GDliQueOXGEsc", 
            authDomain: "telekimo-36af6.firebaseapp.com", 
            projectId: "telekimo-36af6", 
            storageBucket: "telekimo-36af6.firebasestorage.app", 
            messagingSenderId: "430737934562", 
            appId: "1:430737934562:web:22eb31d1fd4742826776bb" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserData = null;
        let activeTarget = null;

        // --- Authentication ---
        window.handleSignUp = async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            try {
                const res = await createUserWithEmailAndPassword(auth, email, pass);
                await sendEmailVerification(res.user);
                // Create user profile in Firestore
                await setDoc(doc(db, "users", email), {
                    email, xCoins: 0, isPremium: false, name: email.split('@')[0]
                });
                alert("تم التسجيل! افتح إيميلك واضغط على رابط التوثيق لتتمكن من الدخول.");
            } catch (e) { alert("خطأ: " + e.message); }
        };

        window.handleSignIn = async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            
            // Admin Bypass Logic
            if(email === "kareemwael0216@gmail.com" && pass === "K_425422") {
                loginSuccess({ email, isAdmin: true });
                return;
            }

            try {
                const res = await signInWithEmailAndPassword(auth, email, pass);
                if(res.user.emailVerified) {
                    loginSuccess(res.user);
                } else {
                    alert("يرجى توثيق حسابك من الإيميل أولاً!");
                    await signOut(auth);
                }
            } catch (e) { alert("بيانات الدخول غير صحيحة"); }
        };

        function loginSuccess(user) {
            document.getElementById('auth-container').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            
            // Listen to User Profile Changes
            onSnapshot(doc(db, "users", user.email), (snap) => {
                currentUserData = snap.data();
                if(user.isAdmin) currentUserData.isAdmin = true;
                
                document.getElementById('user-name').innerText = currentUserData.name;
                document.getElementById('user-coins').innerText = `X: ${currentUserData.xCoins}`;
                document.getElementById('user-initial').innerText = currentUserData.name[0].toUpperCase();
                if(currentUserData.isAdmin) document.getElementById('admin-btn').classList.remove('hidden');
            });

            loadUsers();
        }

        window.handleSignOut = () => {
            signOut(auth);
            location.reload();
        };

        // --- Chat Logic ---
        function loadUsers() {
            onSnapshot(collection(db, "users"), (snap) => {
                const list = document.getElementById('users-list');
                list.innerHTML = "";
                snap.forEach(uDoc => {
                    if(uDoc.id !== currentUserData.email) {
                        const data = uDoc.data();
                        const item = document.createElement('div');
                        item.className = "flex items-center gap-3 p-3 hover:bg-blue-50 cursor-pointer rounded-2xl transition";
                        item.innerHTML = `
                            <div class="w-12 h-12 bg-gray-200 rounded-full flex items-center justify-center font-bold text-gray-500">${data.name[0]}</div>
                            <div>
                                <p class="text-sm font-bold">${data.name} ${data.isPremium ? '⭐' : ''}</p>
                                <p class="text-[10px] text-gray-400">متاح الآن</p>
                            </div>
                        `;
                        item.onclick = () => openChat(data);
                        list.appendChild(item);
                    }
                });
            });
        }

        function openChat(target) {
            activeTarget = target;
            document.getElementById('chat-welcome').classList.add('hidden');
            document.getElementById('active-chat-ui').classList.remove('hidden');
            document.getElementById('target-name').innerText = target.name;
            document.getElementById('target-initial').innerText = target.name[0].toUpperCase();
            loadMessages();
        }

        function loadMessages() {
            const chatId = [currentUserData.email, activeTarget.email].sort().join('_');
            const q = query(collection(db, "chats", chatId, "messages"), orderBy("time", "asc"));
            onSnapshot(q, (snap) => {
                const box = document.getElementById('msg-box');
                box.innerHTML = "";
                snap.forEach(mDoc => {
                    const m = mDoc.data();
                    const isMe = m.sender === currentUserData.email;
                    const div = document.createElement('div');
                    div.className = `max-w-[80%] p-3 rounded-2xl text-sm ${isMe ? 'self-end bg-[#effdde] shadow-sm' : 'self-start bg-white shadow-sm'}`;
                    
                    // Animated emojis for Premium users
                    let content = m.text;
                    if(currentUserData.isPremium) {
                        content = content.replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF])/g, '<span class="animated-emoji">$1</span>');
                    }
                    
                    div.innerHTML = content;
                    box.appendChild(div);
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        window.sendMsg = async () => {
            const txt = document.getElementById('msg-input').value;
            if(!txt || !activeTarget) return;
            const chatId = [currentUserData.email, activeTarget.email].sort().join('_');
            await addDoc(collection(db, "chats", chatId, "messages"), {
                sender: currentUserData.email, text: txt, time: serverTimestamp()
            });
            document.getElementById('msg-input').value = "";
        };

        // --- Admin Controls ---
        window.adminAction = async (type) => {
            const email = document.getElementById('admin-target').value;
            if(!email) return alert("ادخل الإيميل");
            const ref = doc(db, "users", email);
            if(type === 'coins') {
                const val = parseInt(document.getElementById('admin-coins').value);
                const s = await getDoc(ref);
                await updateDoc(ref, { xCoins: (s.data().xCoins || 0) + val });
                alert("تم الشحن!");
            } else {
                await updateDoc(ref, { isPremium: true });
                alert("تم تفعيل البريميوم!");
            }
        };

        // --- UI Helpers ---
        window.showPremiumModal = () => document.getElementById('modal-premium').classList.remove('hidden');
        window.toggleAdminPanel = () => document.getElementById('modal-admin').classList.toggle('hidden');
        window.closeModals = () => {
            document.getElementById('modal-premium').classList.add('hidden');
            document.getElementById('modal-admin').classList.add('hidden');
        };
    </script>
</body>
</html>
