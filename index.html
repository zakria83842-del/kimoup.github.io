<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KimoUp | نسخة الذكاء الاصطناعي V5.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --main: #4f46e5; --bg: #f8fafc; }
        body { background-color: var(--bg); font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .kimo-gradient { background: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%); }
        .ai-gradient { background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%); }
        .chat-pattern { background-image: url('https://www.transparenttextures.com/patterns/cubes.png'); opacity: 0.04; position: absolute; inset: 0; z-index: 0; pointer-events: none; }
        .msg-bubble { position: relative; z-index: 10; transition: all 0.2s; word-break: break-word; }
        .msg-bubble img { max-width: 250px; border-radius: 10px; margin-top: 5px; cursor: pointer; }
        .online-dot { width: 12px; height: 12px; background-color: #22c55e; border-radius: 50%; border: 2px solid white; position: absolute; bottom: 0; right: 0; }
        .tab-btn { flex: 1; padding: 12px; text-align: center; font-weight: bold; color: #64748b; border-bottom: 2px solid transparent; cursor: pointer; }
        .tab-btn.active { color: #4f46e5; border-bottom: 2px solid #4f46e5; background: #e0e7ff; }
        .emoji-panel { display: none; position: absolute; bottom: 90px; right: 20px; background: white; padding: 15px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); z-index: 100; grid-template-columns: repeat(6, 1fr); gap: 10px; }
    </style>
</head>
<body class="h-screen flex items-center justify-center text-gray-800 relative">

    <div id="toast-container" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-[999] flex flex-col gap-2"></div>

    <div id="auth-container" class="z-50 w-full max-w-md p-10 bg-white rounded-[2.5rem] shadow-2xl mx-4 text-center border border-gray-100 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-2 kimo-gradient"></div>
        <div class="w-24 h-24 kimo-gradient rounded-full flex items-center justify-center mx-auto mb-6 shadow-xl border-4 border-indigo-50">
            <i class="fa-solid fa-bolt text-white text-4xl"></i>
        </div>
        <h1 class="text-4xl font-black bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600 mb-2">KimoUp</h1>
        <p class="text-sm text-gray-400 font-bold mb-8">التواصل في أسرع صورة</p>
        <div class="space-y-4">
            <input type="email" id="email" placeholder="البريد الإلكتروني" class="w-full p-4 bg-gray-50 rounded-2xl outline-none focus:ring-2 ring-indigo-500 text-right">
            <input type="password" id="password" placeholder="كلمة المرور" class="w-full p-4 bg-gray-50 rounded-2xl outline-none focus:ring-2 ring-indigo-500 text-right">
            <button onclick="handleSignIn()" class="w-full kimo-gradient text-white p-4 rounded-2xl font-bold shadow-lg hover:-translate-y-1 transition">تسجيل الدخول</button>
            <button onclick="handleSignUp()" class="w-full p-4 text-sm text-indigo-600 font-bold">إنشاء حساب جديد</button>
        </div>
    </div>

    <div id="app-container" class="hidden w-full h-screen flex bg-white overflow-hidden">
        <div class="w-80 md:w-96 border-l flex flex-col bg-white z-20 shadow-2xl">
            <div class="p-6 bg-white border-b">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-black text-indigo-900">KIMO<span class="text-purple-600">UP</span></h2>
                    <button id="admin-btn" onclick="toggleAdminPanel()" class="hidden w-9 h-9 bg-amber-100 text-amber-600 rounded-xl"><i class="fa-solid fa-crown"></i></button>
                </div>
                <div class="flex items-center gap-4">
                    <img id="user-img" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="w-14 h-14 rounded-2xl object-cover" onclick="openSettings()">
                    <div>
                        <p id="user-name-display" class="font-black text-gray-800">تحميل...</p>
                        <p id="user-x-balance" class="text-xs text-amber-600 font-black">X: 0</p>
                    </div>
                </div>
            </div>

            <div class="flex border-b bg-gray-50">
                <div id="tab-chats" class="tab-btn active" onclick="switchTab('chats')">الأصدقاء</div>
                <div id="tab-groups" class="tab-btn" onclick="switchTab('groups')">المجتمعات</div>
            </div>

            <div id="sidebar-action-area" class="p-4 border-b"></div>
            <div id="contacts-list" class="flex-1 overflow-y-auto"></div>
            <div id="groups-list" class="flex-1 overflow-y-auto hidden"></div>
            
            <button onclick="handleSignOut()" class="p-4 text-xs text-red-500 font-bold border-t">تسجيل الخروج</button>
        </div>

        <div class="flex-1 flex flex-col relative bg-gray-50">
            <div class="chat-pattern"></div>
            <div id="welcome-screen" class="absolute inset-0 flex flex-col items-center justify-center text-gray-400 z-10 bg-white/50 backdrop-blur-sm">
                <i class="fa-solid fa-paper-plane text-6xl mb-4"></i>
                <h2 class="text-xl font-bold">ابدأ محادثة الآن</h2>
            </div>

            <div id="chat-ui" class="hidden h-full flex flex-col relative z-10">
                <div class="p-4 bg-white/95 backdrop-blur-md shadow-sm flex justify-between items-center border-b">
                    <div class="flex items-center gap-3">
                        <img id="target-img" src="" class="w-12 h-12 rounded-2xl object-cover">
                        <div>
                            <h3 id="target-name" class="font-black">...</h3>
                            <p id="target-subtitle" class="text-[10px] text-gray-400 font-bold">...</p>
                        </div>
                    </div>
                    <div id="ai-counter" class="hidden bg-cyan-100 text-cyan-700 px-3 py-1 rounded-full text-[10px] font-black"></div>
                </div>

                <div id="messages-area" class="flex-1 p-6 overflow-y-auto flex flex-col gap-3"></div>

                <div id="chat-input-area" class="p-4 bg-white border-t flex items-end gap-3">
                    <label class="w-12 h-12 text-gray-400 hover:text-indigo-500 cursor-pointer flex items-center justify-center">
                        <i class="fa-solid fa-paperclip text-xl"></i>
                        <input type="file" id="chat-file-input" class="hidden" accept="image/*" onchange="sendImageMsg()">
                    </label>
                    <textarea id="msg-input" placeholder="اكتب رسالتك..." class="flex-1 p-3 bg-gray-50 rounded-2xl outline-none resize-none text-sm" rows="1"></textarea>
                    <button id="send-btn" onclick="sendMessage()" class="w-12 h-12 kimo-gradient text-white rounded-2xl shadow-lg">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-settings" class="hidden fixed inset-0 bg-black/50 z-[200] flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-[2rem] w-full max-w-md shadow-2xl">
            <h2 class="text-2xl font-black mb-6">إعدادات الحساب</h2>
            <div class="space-y-4">
                <div class="flex flex-col items-center">
                    <img id="preview-img" src="" class="w-20 h-20 rounded-full object-cover mb-2 border-2 border-indigo-500">
                    <input type="file" id="avatar-input" class="hidden" onchange="previewAvatar()">
                    <button onclick="document.getElementById('avatar-input').click()" class="text-xs text-indigo-600 font-bold">تغيير الصورة</button>
                </div>
                <input type="text" id="set-name" placeholder="الاسم" class="w-full p-4 bg-gray-50 rounded-xl outline-none">
                <input type="text" id="set-badge" placeholder="الشارة" class="w-full p-4 bg-gray-50 rounded-xl outline-none text-center">
                <button onclick="updateProfile()" class="w-full kimo-gradient text-white p-4 rounded-xl font-bold">حفظ</button>
                <button onclick="closeModals()" class="w-full text-gray-400 text-sm">إلغاء</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, query, orderBy, onSnapshot, addDoc, serverTimestamp, arrayUnion, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyDEF8YAXmkV5t7scY1St2GDliQueOXGEsc", 
            authDomain: "telekimo-36af6.firebaseapp.com", 
            projectId: "telekimo-36af6", 
            storageBucket: "telekimo-36af6.firebasestorage.app", 
            messagingSenderId: "430737934562", 
            appId: "1:430737934562:web:22eb31d1fd4742826776bb" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- GROQ AI CONFIG ---
        const GROQ_API_KEY = "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";
        const AI_BOT_ID = "kimo_ai_assistant";

        let currentUser = null;
        let activeChat = null;
        let chatType = 'direct';
        let currentTab = 'chats';
        let unsubscribe = null;

        window.showToast = (msg, type = 'info') => {
            const container = document.getElementById('toast-container');
            const el = document.createElement('div');
            el.className = `${type === 'error' ? 'bg-red-500' : 'bg-indigo-600'} text-white px-6 py-2 rounded-xl text-sm font-bold shadow-lg`;
            el.innerText = msg;
            container.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        };

        window.handleSignIn = async () => {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;
            try {
                const res = await signInWithEmailAndPassword(auth, email, pass);
                enterApp(res.user.email);
            } catch (e) { showToast("خطأ في الدخول", "error"); }
        };

        window.handleSignUp = async () => {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;
            try {
                await createUserWithEmailAndPassword(auth, email, pass);
                await setDoc(doc(db, "users", email), { email, name: email.split('@')[0], aiCount: 0, xCoins: 0, contacts: [] });
                showToast("تم التسجيل بنجاح!");
            } catch (e) { showToast("خطأ في البيانات", "error"); }
        };

        async function enterApp(email) {
            document.getElementById('auth-container').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            
            onSnapshot(doc(db, "users", email), (s) => {
                currentUser = s.data();
                document.getElementById('user-name-display').innerText = currentUser.name;
                document.getElementById('user-x-balance').innerText = `X: ${currentUser.xCoins || 0}`;
                renderSidebar();
            });
        }

        window.switchTab = (t) => {
            currentTab = t;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${t}`).classList.add('active');
            document.getElementById('contacts-list').classList.toggle('hidden', t !== 'chats');
            document.getElementById('groups-list').classList.toggle('hidden', t !== 'groups');
            renderSidebar();
        };

        async function renderSidebar() {
            const container = document.getElementById('contacts-list');
            if (currentTab === 'chats') {
                container.innerHTML = `
                    <div onclick="openAIChat()" class="flex items-center gap-4 p-4 ai-gradient text-white cursor-pointer mb-1">
                        <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center text-2xl"><i class="fa-solid fa-robot"></i></div>
                        <div>
                            <p class="font-black">Kimo AI Assistant</p>
                            <p class="text-[10px] opacity-80">مساعدك الذكي (متصل)</p>
                        </div>
                    </div>
                `;
                const list = currentUser.contacts || [];
                for (let email of list) {
                    const snap = await getDoc(doc(db, "users", email));
                    if(snap.exists()) {
                        const d = snap.data();
                        const div = document.createElement('div');
                        div.className = "p-4 border-b flex items-center gap-3 cursor-pointer hover:bg-gray-50";
                        div.innerHTML = `<img src="${d.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" class="w-10 h-10 rounded-full"> <div><p class="font-bold text-sm">${d.name}</p></div>`;
                        div.onclick = () => openChat(d, 'direct');
                        container.appendChild(div);
                    }
                }
            }
        }

        window.openAIChat = () => {
            activeChat = { email: AI_BOT_ID, name: "Kimo AI Assistant", avatar: "robot" };
            chatType = 'ai';
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('chat-ui').classList.remove('hidden');
            document.getElementById('target-name').innerText = activeChat.name;
            document.getElementById('target-img').src = "https://cdn-icons-png.flaticon.com/512/4712/4712035.png";
            document.getElementById('target-subtitle').innerText = "يعمل بواسطة Groq Cloud LLM";
            
            const counterEl = document.getElementById('ai-counter');
            counterEl.classList.remove('hidden');
            counterEl.innerText = `الرسائل المجانية: ${currentUser.aiCount || 0} / 10`;
            
            loadMessages(AI_BOT_ID, "ai_chats");
        };

        function openChat(target, type) {
            activeChat = target;
            chatType = type;
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('chat-ui').classList.remove('hidden');
            document.getElementById('target-name').innerText = target.name;
            document.getElementById('target-img').src = target.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
            document.getElementById('ai-counter').classList.add('hidden');
            
            const chatId = [currentUser.email, target.email].sort().join('_');
            loadMessages(chatId, "chats");
        }

        function loadMessages(id, collectionName) {
            if(unsubscribe) unsubscribe();
            const q = query(collection(db, collectionName, id, "messages"), orderBy("time", "asc"));
            unsubscribe = onSnapshot(q, (snap) => {
                const area = document.getElementById('messages-area');
                area.innerHTML = "";
                snap.forEach(d => {
                    const m = d.data();
                    const isMe = m.sender === currentUser.email;
                    const div = document.createElement('div');
                    div.className = isMe ? "self-end bg-indigo-600 text-white p-3 rounded-2xl rounded-br-none max-w-[80%]" : "self-start bg-white p-3 rounded-2xl rounded-bl-none shadow-sm max-w-[80%]";
                    
                    if(m.type === 'image') div.innerHTML += `<img src="${m.url}" class="rounded-lg mb-1">`;
                    if(m.text) div.innerHTML += `<p class="text-sm">${m.text}</p>`;
                    
                    area.appendChild(div);
                });
                area.scrollTop = area.scrollHeight;
            });
        }

        window.sendMessage = async () => {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if(!text) return;
            input.value = "";

            if(chatType === 'ai') {
                if((currentUser.aiCount || 0) >= 10) {
                    return alert("لقد استنفدت 10 رسائل مجانية. يرجى الترقية إلى النسخة البريميوم للاستمرار!");
                }
                
                // إضافة رسالة المستخدم
                const id = AI_BOT_ID;
                await addDoc(collection(db, "ai_chats", id, "messages"), { sender: currentUser.email, text, time: serverTimestamp() });
                
                // استدعاء AI
                callGroqAI(text);
            } else {
                const chatId = [currentUser.email, activeChat.email].sort().join('_');
                await addDoc(collection(db, "chats", chatId, "messages"), { sender: currentUser.email, text, time: serverTimestamp() });
            }
        };

        async function callGroqAI(userText, base64Image = null) {
            try {
                let messages = [{ role: "user", content: [ { type: "text", text: userText } ] }];
                if (base64Image) {
                    messages[0].content.push({ type: "image_url", image_url: { url: base64Image } });
                }

                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.2-11b-vision-preview",
                        messages: messages,
                        max_tokens: 500
                    })
                });

                const data = await response.json();
                const aiText = data.choices[0].message.content;

                // حفظ رسالة الـ AI
                await addDoc(collection(db, "ai_chats", AI_BOT_ID, "messages"), { 
                    sender: "ai", 
                    text: aiText, 
                    time: serverTimestamp() 
                });

                // تحديث العداد
                const newCount = (currentUser.aiCount || 0) + 1;
                await updateDoc(doc(db, "users", currentUser.email), { aiCount: newCount });
                
            } catch (e) {
                showToast("خطأ في الاتصال بالذكاء الاصطناعي", "error");
            }
        }

        window.sendImageMsg = () => {
            const file = document.getElementById('chat-file-input').files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onloadend = async () => {
                if(chatType === 'ai') {
                    if((currentUser.aiCount || 0) >= 10) return alert("يرجى الترقية للبريميوم!");
                    await addDoc(collection(db, "ai_chats", AI_BOT_ID, "messages"), { sender: currentUser.email, type: 'image', url: reader.result, time: serverTimestamp() });
                    callGroqAI("ماذا يوجد في هذه الصورة؟", reader.result);
                } else {
                    const chatId = [currentUser.email, activeChat.email].sort().join('_');
                    await addDoc(collection(db, "chats", chatId, "messages"), { sender: currentUser.email, type: 'image', url: reader.result, time: serverTimestamp() });
                }
            };
            reader.readAsDataURL(file);
        };

        // وظائف إضافية للمودال والإغلاق
        window.closeModals = () => document.getElementById('modal-settings').classList.add('hidden');
        window.openSettings = () => document.getElementById('modal-settings').classList.remove('hidden');
        window.handleSignOut = () => location.reload();
        
        // دعم زر الـ Enter
        document.getElementById('msg-input').addEventListener('keypress', (e) => {
            if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });
    </script>
</body>
</html>
