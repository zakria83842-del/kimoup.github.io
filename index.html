<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KimoUp Stable V8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .hidden { display: none; }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center p-4">

    <div id="login-screen" class="glass p-8 rounded-3xl w-full max-w-md text-center">
        <h1 class="text-3xl font-bold mb-6">KIMO<span class="text-blue-500">UP</span> AI</h1>
        <div class="space-y-4">
            <input type="email" id="email" placeholder="الإيميل" class="w-full p-4 bg-slate-900 rounded-xl outline-none border border-slate-700 focus:border-blue-500">
            <input type="password" id="pass" placeholder="كلمة المرور" class="w-full p-4 bg-slate-900 rounded-xl outline-none border border-slate-700 focus:border-blue-500">
            <button onclick="handleLogin()" class="w-full bg-blue-600 p-4 rounded-xl font-bold hover:bg-blue-500 transition-all">دخول</button>
            <p id="auth-error" class="text-red-500 text-xs hidden"></p>
        </div>
    </div>

    <div id="app-screen" class="hidden w-full h-full flex flex-col gap-4">
        <header class="glass p-4 rounded-2xl flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img id="user-img" src="" class="w-10 h-10 rounded-full bg-blue-500">
                <span id="user-name" class="font-bold text-lg">تحميل...</span>
            </div>
            <div class="flex gap-4 items-center">
                <span class="text-yellow-500 font-bold">X: <span id="user-coins">0</span></span>
                <button onclick="handleLogout()" class="text-red-400 text-xs">خروج</button>
            </div>
        </header>

        <main class="flex-1 glass rounded-3xl p-6 overflow-y-auto" id="chat-area">
            </main>

        <footer class="glass p-4 rounded-2xl flex gap-2">
            <input id="msg-input" type="text" placeholder="اسأل كيمو AI..." class="flex-1 bg-transparent outline-none">
            <button onclick="sendMsg()" class="bg-blue-600 px-6 py-2 rounded-xl">إرسال</button>
        </footer>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyDEF8YAXmkV5t7scY1St2GDliQueOXGEsc", 
            authDomain: "telekimo-36af6.firebaseapp.com", 
            projectId: "telekimo-36af6", 
            appId: "1:430737934562:web:22eb31d1fd4742826776bb" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- نظام المراقبة الذكي (يمنع أخطاء الـ Null) ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // أول خطوة: سحب البيانات من الداتا باز فوراً
                const docRef = doc(db, "users", user.email);
                const snap = await getDoc(docRef);

                if (snap.exists()) {
                    // لو الداتا موجودة، ابدأ بتحديث الواجهة فوراً
                    const userData = snap.data();
                    document.getElementById('user-name').innerText = userData.name;
                    document.getElementById('user-coins').innerText = userData.coins;
                    document.getElementById('user-img').src = userData.avatar || `https://ui-avatars.com/api/?name=${userData.name}`;
                    
                    // أخيراً اظهر واجهة التطبيق
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('app-screen').classList.remove('hidden');
                } else {
                    // لو أول مرة يسجل، أنشئ له داتا باز فوراً
                    await setDoc(docRef, { name: user.email.split('@')[0], coins: 100, avatar: "" });
                    window.location.reload(); // إعادة تحميل بسيطة لتأكيد البيانات
                }
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('app-screen').classList.add('hidden');
            }
        });

        // --- وظائف التعامل مع الأزرار ---
        window.handleLogin = async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            const errorLabel = document.getElementById('auth-error');
            
            try {
                errorLabel.classList.add('hidden');
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (err) {
                errorLabel.innerText = "خطأ: الإيميل أو كلمة المرور غير صحيحة";
                errorLabel.classList.remove('hidden');
            }
        };

        window.handleLogout = () => signOut(auth);

    </script>
</body>
</html>
