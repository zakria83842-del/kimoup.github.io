<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KimoUp | النسخة العملاقة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --main: #6366f1; }
        body { background-color: #f1f5f9; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; }
        .kimo-gradient { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
        .gift-bear { animation: bounce 2s infinite; cursor: pointer; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1)); }
        @keyframes bounce { 0%, 100% { transform: translateY(0) rotate(-5deg); } 50% { transform: translateY(-10px) rotate(5deg); } }
        .emoji-panel { display: none; position: absolute; bottom: 80px; right: 20px; background: white; padding: 10px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); z-index: 100; grid-template-columns: repeat(5, 1fr); gap: 5px; }
    </style>
</head>
<body class="h-screen flex items-center justify-center">

    <div id="auth-container" class="z-50 w-full max-w-md p-10 bg-white rounded-[3rem] shadow-2xl mx-4 text-center">
        <div class="w-20 h-20 kimo-gradient rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-xl"><i class="fa-solid fa-rocket text-white text-4xl"></i></div>
        <h1 class="text-3xl font-black text-gray-800">KimoUp</h1>
        <div class="mt-8 space-y-3">
            <input type="email" id="email" placeholder="الإيميل" class="w-full p-4 bg-gray-50 rounded-2xl outline-none text-right">
            <input type="password" id="password" placeholder="الباسورد" class="w-full p-4 bg-gray-50 rounded-2xl outline-none text-right">
            <button onclick="handleSignIn()" class="w-full kimo-gradient text-white p-4 rounded-2xl font-bold shadow-lg">دخول</button>
            <button onclick="handleSignUp()" class="text-xs text-indigo-600 font-bold">إنشاء حساب</button>
        </div>
    </div>

    <div id="app-container" class="hidden w-full h-screen flex bg-white overflow-hidden">
        <div class="w-80 border-l flex flex-col bg-white z-10 shadow-xl">
            <div class="p-6 kimo-gradient text-white">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold italic">KIMOUP</h2>
                    <div class="flex gap-2">
                        <button onclick="openSettings()" class="w-8 h-8 bg-white/20 rounded-lg flex items-center justify-center"><i class="fa-solid fa-gear"></i></button>
                        <button id="admin-btn" onclick="toggleAdminPanel()" class="hidden w-8 h-8 bg-yellow-400 text-indigo-900 rounded-lg flex items-center justify-center"><i class="fa-solid fa-crown"></i></button>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="relative">
                        <img id="user-img" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="w-14 h-14 rounded-2xl border-2 border-white/30 object-cover">
                        <span id="user-badge" class="absolute -top-2 -right-2 text-lg"></span>
                    </div>
                    <div>
                        <p id="user-name-display" class="font-bold">تحميل...</p>
                        <p id="user-x-balance" class="text-xs text-yellow-300 font-black">X: 0</p>
                    </div>
                </div>
            </div>

            <div class="p-4 bg-indigo-50 flex gap-2">
                <input type="email" id="target-email" placeholder="أضف صديق بالإيميل" class="flex-1 p-3 text-xs rounded-xl border-none">
                <button onclick="addNewContact()" class="bg-indigo-600 text-white px-4 rounded-xl"><i class="fa-solid fa-plus"></i></button>
            </div>

            <div id="contacts-list" class="flex-1 overflow-y-auto"></div>
            <button onclick="location.reload()" class="p-4 text-[10px] text-gray-400 font-bold border-t">خروج</button>
        </div>

        <div class="flex-1 flex flex-col relative bg-gray-50">
            <div id="chat-ui" class="hidden h-full flex flex-col relative z-10">
                <div class="p-4 bg-white/90 backdrop-blur shadow-sm flex justify-between items-center px-8 border-b">
                    <div class="flex items-center gap-3">
                        <img id="target-img" src="" class="w-10 h-10 rounded-xl object-cover bg-gray-200">
                        <h3 id="target-name" class="font-black text-gray-800">...</h3>
                    </div>
                    <button onclick="sendXGift()" class="bg-orange-500 text-white px-4 py-2 rounded-xl text-xs font-bold hover:scale-105 transition">إرسال دبدوب هدية 🧸</button>
                </div>

                <div id="messages-area" class="flex-1 p-6 overflow-y-auto flex flex-col gap-4"></div>

                <div class="p-6 flex gap-3 items-center px-8 bg-white border-t relative">
                    <div id="emoji-picker" class="emoji-panel">
                        <button onclick="addEmoji('😊')">😊</button><button onclick="addEmoji('😂')">😂</button><button onclick="addEmoji('❤️')">❤️</button>
                        <button onclick="addEmoji('🔥')">🔥</button><button onclick="addEmoji('👍')">👍</button><button onclick="addEmoji('🎁')">🎁</button>
                        <button onclick="addEmoji('🧸')">🧸</button><button onclick="addEmoji('✨')">✨</button><button onclick="addEmoji('✔️')">✔️</button>
                        <button onclick="addEmoji('👑')">👑</button>
                    </div>
                    <button onclick="toggleEmoji()" class="text-2xl text-gray-400 hover:text-indigo-600 transition"><i class="fa-regular fa-face-smile"></i></button>
                    <button id="voice-btn" class="w-12 h-12 bg-gray-100 text-gray-400 rounded-2xl flex items-center justify-center transition active:bg-red-500 active:text-white"><i class="fa-solid fa-microphone"></i></button>
                    <input type="text" id="msg-input" placeholder="اكتب هنا..." class="flex-1 p-4 rounded-2xl bg-gray-50 outline-none border-none">
                    <button onclick="sendTextMessage()" class="w-14 h-14 kimo-gradient text-white rounded-2xl shadow-xl flex items-center justify-center"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-settings" class="hidden fixed inset-0 bg-black/60 z-[200] flex items-center justify-center p-4 backdrop-blur-md">
        <div class="bg-white p-8 rounded-[2.5rem] w-full max-w-sm shadow-2xl">
            <h2 class="text-xl font-black mb-6">إعدادات بروفايلك</h2>
            <div class="space-y-4">
                <div class="flex flex-col items-center mb-4">
                    <img id="preview-img" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="w-20 h-20 rounded-full object-cover mb-2 border-4 border-indigo-50">
                    <label class="bg-indigo-50 text-indigo-600 px-4 py-2 rounded-xl text-xs font-bold cursor-pointer hover:bg-indigo-100">
                        رفع صورة من جهازك
                        <input type="file" id="file-input" class="hidden" accept="image/*" onchange="previewFile()">
                    </label>
                </div>
                <input type="text" id="set-name" placeholder="الاسم المستعار" class="w-full p-4 bg-gray-50 rounded-2xl outline-none">
                <input type="text" id="set-badge" placeholder="إيموجي أو ستيكر بجانب الاسم" class="w-full p-4 bg-gray-50 rounded-2xl outline-none text-center">
                <button onclick="updateProfile()" class="w-full kimo-gradient text-white p-4 rounded-2xl font-bold shadow-lg">حفظ التغييرات</button>
                <button onclick="closeModals()" class="w-full text-gray-400 text-sm">إلغاء</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, query, orderBy, onSnapshot, addDoc, serverTimestamp, arrayUnion, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyDEF8YAXmkV5t7scY1St2GDliQueOXGEsc", 
            authDomain: "telekimo-36af6.firebaseapp.com", 
            projectId: "telekimo-36af6", 
            storageBucket: "telekimo-36af6.firebasestorage.app", 
            messagingSenderId: "430737934562", 
            appId: "1:430737934562:web:22eb31d1fd4742826776bb" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let activeChat = null;
        let base64Avatar = "";

        // --- Notification Request ---
        if (Notification.permission !== "granted") {
            Notification.requestPermission();
        }

        // --- Auth Core ---
        async function enterApp(email, isAdmin = false) {
            const userRef = doc(db, "users", email);
            const snap = await getDoc(userRef);
            if (!snap.exists()) {
                await setDoc(userRef, { email, name: email.split('@')[0], avatar: "", xCoins: 0, badge: "", contacts: [] });
            }

            document.getElementById('auth-container').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');

            onSnapshot(userRef, (docSnap) => {
                currentUser = docSnap.data();
                if(isAdmin) currentUser.isAdmin = true;
                document.getElementById('user-name-display').innerText = currentUser.name;
                document.getElementById('user-x-balance').innerText = `X: ${currentUser.xCoins}`;
                document.getElementById('user-badge').innerText = currentUser.badge || "";
                if (currentUser.avatar) document.getElementById('user-img').src = currentUser.avatar;
                if (currentUser.isAdmin) document.getElementById('admin-btn').classList.remove('hidden');
                loadContacts(currentUser.contacts || []);
            });
        }

        window.handleSignIn = async () => {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;
            try {
                if (email === "kareemwael0216@gmail.com" && pass === "K_425422") {
                    await enterApp(email, true);
                } else {
                    const res = await signInWithEmailAndPassword(auth, email, pass);
                    await enterApp(res.user.email, false);
                }
            } catch (e) { alert("خطأ في الدخول"); }
        };

        // --- File Handling (Upload) ---
        window.previewFile = () => {
            const file = document.getElementById('file-input').files[0];
            const reader = new FileReader();
            reader.onloadend = () => {
                base64Avatar = reader.result;
                document.getElementById('preview-img').src = base64Avatar;
            };
            if (file) reader.readAsDataURL(file);
        };

        window.updateProfile = async () => {
            const name = document.getElementById('set-name').value;
            const badge = document.getElementById('set-badge').value;
            const updateData = { name, badge };
            if (base64Avatar) updateData.avatar = base64Avatar;
            await updateDoc(doc(db, "users", currentUser.email), updateData);
            closeModals();
        };

        // --- Gift Logic (The Bear) ---
        window.sendXGift = async () => {
            const amount = parseInt(prompt("كمية العملات داخل الدبدوب:"));
            if(isNaN(amount) || currentUser.xCoins < amount) return alert("رصيد غير كافٍ");
            
            const chatId = [currentUser.email, activeChat.email].sort().join('_');
            await updateDoc(doc(db, "users", currentUser.email), { xCoins: currentUser.xCoins - amount });
            
            await addDoc(collection(db, "chats", chatId, "messages"), {
                sender: currentUser.email, senderName: currentUser.name, 
                amount, type: 'gift', status: 'pending', time: serverTimestamp()
            });
        };

        window.claimGift = async (msgId, amount) => {
            const chatId = [currentUser.email, activeChat.email].sort().join('_');
            await updateDoc(doc(db, "users", currentUser.email), { xCoins: currentUser.xCoins + amount });
            await deleteDoc(doc(db, "chats", chatId, "messages", msgId)); // مسح الرسالة بعد الاستلام
            confetti({ particleCount: 200, spread: 100 });
            alert(`مبروك! استلمت ${amount} عملة 🧸`);
        };

        // --- Chat & Notifications ---
        function loadMessages() {
            const chatId = [currentUser.email, activeChat.email].sort().join('_');
            onSnapshot(query(collection(db, "chats", chatId, "messages"), orderBy("time", "asc")), (snap) => {
                const box = document.getElementById('messages-area');
                box.innerHTML = "";
                snap.forEach(mDoc => {
                    const m = mDoc.data();
                    const isMe = m.sender === currentUser.email;
                    const div = document.createElement('div');
                    
                    if (m.type === 'gift') {
                        div.className = "self-center text-center my-4";
                        div.innerHTML = `
                            <div class="gift-bear text-6xl" onclick="claimGift('${mDoc.id}', ${m.amount})">🧸</div>
                            <p class="text-[10px] font-black text-orange-500 mt-2">دبدوب هدية من ${m.senderName}</p>
                            ${!isMe ? '<button class="text-[9px] bg-orange-100 text-orange-600 px-2 py-1 rounded-lg mt-1 font-bold">اضغط للاستلام</button>' : ''}
                        `;
                    } else {
                        div.className = `max-w-[75%] p-4 rounded-3xl ${isMe ? 'self-end bg-indigo-600 text-white' : 'self-start bg-white shadow-sm'}`;
                        div.innerText = m.text;
                    }
                    box.appendChild(div);

                    // Push Notification
                    if (!isMe && document.hidden) {
                        new Notification("KimoUp", { body: `رسالة جديدة من ${m.senderName}`, icon: "/logo.png" });
                    }
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        // --- UI Helpers ---
        window.toggleEmoji = () => {
            const p = document.getElementById('emoji-picker');
            p.style.display = p.style.display === 'grid' ? 'none' : 'grid';
        };
        window.addEmoji = (e) => {
            document.getElementById('msg-input').value += e;
            toggleEmoji();
        };
        window.openSettings = () => {
            document.getElementById('set-name').value = currentUser.name;
            document.getElementById('set-badge').value = currentUser.badge || "";
            document.getElementById('preview-img').src = currentUser.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
            document.getElementById('modal-settings').classList.remove('hidden');
        };
        window.closeModals = () => document.querySelectorAll('[id^="modal-"]').forEach(m => m.classList.add('hidden'));

        // --- Rest of functions (addNewContact, loadContacts, startChat, sendTextMessage) remain same as V3.2 ---
        // [Copy these from previous version to complete the script]
        window.addNewContact = async () => {
            const targetEmail = document.getElementById('target-email').value.trim();
            const check = await getDoc(doc(db, "users", targetEmail));
            if(check.exists()) {
                await updateDoc(doc(db, "users", currentUser.email), { contacts: arrayUnion(targetEmail) });
                document.getElementById('target-email').value = "";
            }
        };

        async function loadContacts(list) {
            const container = document.getElementById('contacts-list');
            container.innerHTML = "";
            for (const email of list) {
                const uDoc = await getDoc(doc(db, "users", email));
                if(uDoc.exists()) {
                    const data = uDoc.data();
                    const div = document.createElement('div');
                    div.className = "flex items-center gap-4 p-4 hover:bg-gray-50 cursor-pointer border-b border-gray-50 transition";
                    div.innerHTML = `<img src="${data.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" class="w-11 h-11 rounded-xl object-cover">
                                     <div><p class="text-sm font-bold">${data.name} ${data.badge || ''}</p></div>`;
                    div.onclick = () => { activeChat = data; document.getElementById('chat-ui').classList.remove('hidden'); document.getElementById('target-name').innerText = data.name; document.getElementById('target-img').src = data.avatar; loadMessages(); };
                    container.appendChild(div);
                }
            }
        }

        window.sendTextMessage = async () => {
            const txt = document.getElementById('msg-input').value.trim();
            if(!txt || !activeChat) return;
            const chatId = [currentUser.email, activeChat.email].sort().join('_');
            await addDoc(collection(db, "chats", chatId, "messages"), { sender: currentUser.email, senderName: currentUser.name, text: txt, type: 'text', time: serverTimestamp() });
            document.getElementById('msg-input').value = "";
        };
    </script>
</body>
</html>
