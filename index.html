<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KimoUp | النسخة الماستر V5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --main: #4f46e5; --bg: #f8fafc; }
        body { background-color: var(--bg); font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .kimo-gradient { background: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%); }
        .chat-pattern { background-image: url('https://www.transparenttextures.com/patterns/cubes.png'); opacity: 0.04; position: absolute; inset: 0; z-index: 0; pointer-events: none; }
        
        /* مصحح: بدون word-break عشان الحروف العربية تتصل */
        .msg-bubble { position: relative; z-index: 10; transition: all 0.2s; }
        .msg-bubble img { max-width: 250px; border-radius: 10px; margin-top: 5px; cursor: pointer; }
        
        .gift-bear { font-size: 4rem; animation: float 3s ease-in-out infinite; cursor: pointer; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.15)); transition: transform 0.2s; }
        .gift-bear:hover { transform: scale(1.1); }
        .gift-claimed { font-size: 3rem; filter: grayscale(100%); opacity: 0.5; cursor: not-allowed; }
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-15px) rotate(2deg); } }
        
        .online-dot { width: 12px; height: 12px; background-color: #22c55e; border-radius: 50%; border: 2px solid white; position: absolute; bottom: 0; right: 0; box-shadow: 0 0 5px rgba(34, 197, 94, 0.5); }
        
        .tab-btn { flex: 1; padding: 12px; text-align: center; font-weight: bold; color: #64748b; border-bottom: 2px solid transparent; cursor: pointer; transition: all 0.3s; }
        .tab-btn.active { color: #4f46e5; border-bottom: 2px solid #4f46e5; background: #e0e7ff; }
        
        .emoji-panel { display: none; position: absolute; bottom: 90px; right: 20px; background: white; padding: 15px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); z-index: 100; grid-template-columns: repeat(6, 1fr); gap: 10px; border: 1px solid #f1f5f9; }
        .emoji-panel button { font-size: 1.5rem; transition: transform 0.1s; }
        .emoji-panel button:hover { transform: scale(1.2); }

        .ai-bot-card {
            background: linear-gradient(135deg, #eef2ff 0%, #faf5ff 50%, #fdf2f8 100%);
            border: 1px solid #c7d2fe; border-radius: 16px; margin: 8px; padding: 12px;
            cursor: pointer; transition: all 0.3s; position: relative; overflow: hidden;
        }
        .ai-bot-card::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(99,102,241,0.06) 0%, transparent 70%);
            animation: aiPulse 4s ease-in-out infinite;
        }
        .ai-bot-card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(99,102,241,0.15); border-color: #a5b4fc; }
        @keyframes aiPulse { 0%, 100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.1); opacity: 1; } }

        .typing-dots { display: inline-flex; gap: 5px; align-items: center; padding: 4px 0; }
        .typing-dots span { width: 8px; height: 8px; background: #818cf8; border-radius: 50%; animation: typingBounce 1.4s infinite ease-in-out; }
        .typing-dots span:nth-child(1) { animation-delay: 0s; }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-10px); opacity: 1; } }

        .ai-counter-bar { background: linear-gradient(90deg, #eef2ff, #faf5ff); border-bottom: 1px solid #e0e7ff; padding: 8px 16px; text-align: center; }
        .premium-glow { animation: premiumPulse 2s ease-in-out infinite; }
        @keyframes premiumPulse { 0%, 100% { filter: drop-shadow(0 0 3px rgba(245,158,11,0.3)); } 50% { filter: drop-shadow(0 0 8px rgba(245,158,11,0.6)); } }

        .bot-avatar-ring { background: conic-gradient(from 0deg, #6366f1, #a855f7, #ec4899, #6366f1); padding: 2px; border-radius: 14px; animation: ringRotate 3s linear infinite; }
        @keyframes ringRotate { to { filter: hue-rotate(360deg); } }

        /* ===== تنسيق رسائل البوت - مصحح للعربي ===== */
        .bot-msg-text {
            line-height: 2;
            direction: rtl;
            text-align: right;
            font-size: 14px;
            white-space: normal;
            overflow-wrap: anywhere;
        }
        .bot-msg-text strong { color: #4338ca; font-weight: 800; }
        .bot-msg-text em { color: #7c3aed; }
        .bot-msg-text code {
            background: #e0e7ff; color: #4338ca;
            padding: 2px 6px; border-radius: 6px;
            font-size: 0.8em; font-family: 'Courier New', monospace;
            direction: ltr; display: inline-block;
        }
        .bot-msg-text pre {
            background: #1e1b4b; color: #c7d2fe;
            padding: 12px; border-radius: 10px;
            overflow-x: auto; direction: ltr; text-align: left;
            margin: 8px 0; font-family: 'Courier New', monospace; font-size: 0.8em;
            white-space: pre;
        }

        /* رسائل المستخدم العادية */
        .user-msg-text {
            line-height: 1.8;
            direction: rtl;
            text-align: right;
            font-size: 14px;
            white-space: normal;
            overflow-wrap: anywhere;
        }
    </style>
</head>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

        import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, query, orderBy, onSnapshot, addDoc, serverTimestamp, arrayUnion, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDEF8YAXmkV5t7scY1St2GDliQueOXGEsc", authDomain: "telekimo-36af6.firebaseapp.com", projectId: "telekimo-36af6", storageBucket: "telekimo-36af6.firebasestorage.app", messagingSenderId: "430737934562", appId: "1:430737934562:web:22eb31d1fd4742826776bb" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null, activeChat = null, chatType = 'direct', currentTab = 'chats';

        function compressImageForAPI(base64DataUrl, maxW = 512, quality = 0.5) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    if (w > maxW) { h = Math.round((h * maxW) / w); w = maxW; }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = () => resolve(base64DataUrl);
                img.src = base64DataUrl;
            });
        }

        function buildAPIMessages(history) {
            const messages = [{ role: "system", content: "أنت مساعد ذكاء اصطناعي اسمك KimoAI في تطبيق KimoUp. تجيب باللغة العربية بشكل أساسي. تساعد في الإجابة على الأسئلة والتحليل والكتابة والبرمجة والمحادثة. إذا أُرسلت صورة قم بتحليلها ووصفها. ردودك يجب أن تكون كاملة ومفيدة ومباشرة." }];
            const recent = history.slice(-20);
            let lastImgIdx = -1;
            for (let i = recent.length - 1; i >= 0; i--) { if (recent[i].type === 'image' && recent[i].sender !== AI_BOT_EMAIL) { lastImgIdx = i; break; } }
            for (let i = 0; i < recent.length; i++) {
                const msg = recent[i], isBot = msg.sender === AI_BOT_EMAIL, role = isBot ? "assistant" : "user";
                if (msg.type === 'gift' || msg.type === 'voice') continue;
                if (msg.type === 'text') { const txt = msg.text || ""; if (txt) messages.push({ role, content: txt }); }
                else if (msg.type === 'image' && !isBot) {
                    if (i === lastImgIdx && msg.url) messages.push({ role, content: [{ type: "text", text: msg.text || "قم بتحليل هذه الصورة" }, { type: "image_url", image_url: { url: msg.url } }] });
                    else messages.push({ role, content: "[أرسل المستخدم صورة]" });
                }
            }
            return messages;
        }

        async function callGroqAPI(apiMessages, hasImage) {
            const model = hasImage ? GROQ_MODEL : "llama-3.1-8b-instant";
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 30000);
            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST", headers: { "Authorization": `Bearer ${GROQ_API_KEY}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ model, messages: apiMessages, max_tokens: 2048, temperature: 0.7 }),
                    signal: controller.signal
                });
                clearTimeout(timeout);
                if (!response.ok) { let errText = ""; try { const e = await response.json(); errText = e.error?.message || JSON.stringify(e); } catch(e2) { errText = `HTTP ${response.status}`; } throw new Error(errText); }
                const data = await response.json();
                const reply = data.choices?.[0]?.message?.content;
                if (!reply) throw new Error("رد فاضي من الAPI");
                return reply;
            } catch (error) { clearTimeout(timeout); throw error; }
        }

                        if (msg.type === 'gift' || msg.type === 'voice') continue;
                        if (msg.type === 'text') { if (msg.text) apiMessages.push({ role, content: msg.text }); }

                    const botLabel = isBotMsg && !isMe ? `<p class="text-[10px] font-bold text-indigo-500 mb-1 ml-2"><i class="fa-solid fa-robot text-[8px]"></i> ${AI_BOT_NAME}</p>` : '';

                    let html = '';
                    if (m.type === 'gift') {
                        const claimed = m.status === 'claimed';
                        html = `<div class="bg-gradient-to-br from-amber-50 to-orange-50 border border-amber-200 p-6 rounded-3xl text-center shadow-lg my-2 w-64"><div class="${claimed ? 'gift-claimed' : 'gift-bear'}" onclick="claimGift('${msgId}',${m.amount},${isMe},'${m.status}','${collectionId}')">\u{1F9F8}</div><div class="mt-4 bg-white/60 p-2 rounded-xl"><p class="text-xs font-black text-amber-700">دبدوب ${m.amount} X</p><p class="text-[9px] font-bold text-gray-500 mt-1">${claimed ? 'تم الاستلام' : (isMe ? 'أرسلت هدية' : 'اضغط للاستلام')}</p></div></div>`;
                    } else if (m.type === 'image') {
                        const bc = isBotMsg ? 'bg-gradient-to-br from-indigo-50 to-purple-50 border border-indigo-100 rounded-bl-none' : (isMe ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-white border border-gray-100 rounded-bl-none');
                        html = `<div class="msg-bubble max-w-[85%] sm:max-w-[70%] p-1 rounded-2xl shadow-sm ${bc}"><img src="${m.url}" onclick="window.open('${m.url}')"><div class="text-left mt-1 px-2">${statusIcon}</div></div>`;
                    } else if (m.type === 'voice') {
                        const bc = isMe ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-white border border-gray-100 rounded-bl-none';
                        html = `<div class="msg-bubble max-w-[85%] sm:max-w-[70%] p-3 rounded-2xl shadow-sm ${bc} flex items-center gap-2"><audio controls src="${m.audio}" class="h-8 w-48"></audio>${statusIcon}</div>`;
                    } else {
                        if (isBotMsg) {
                            html = `<div class="msg-bubble max-w-[85%] sm:max-w-[70%] p-4 rounded-2xl shadow-sm bg-gradient-to-br from-indigo-50 to-purple-50 border border-indigo-100 text-gray-800 rounded-bl-none"><div class="bot-msg-text">${formatBotText(m.text)}</div><div class="text-left mt-2 text-[10px] opacity-60"><i class="fa-solid fa-robot text-indigo-300 mr-1"></i>${statusIcon}</div></div>`;
                        } else {
                            const bc = isMe ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-white border border-gray-100 text-gray-800 rounded-bl-none';
                            html = `<div class="msg-bubble max-w-[85%] sm:max-w-[70%] p-3 rounded-2xl shadow-sm ${bc}"><p class="user-msg-text">${escapeHTML(m.text)}</p><div class="text-left mt-1 text-[10px] opacity-70">${statusIcon}</div></div>`;
                        }
                    }
                    div.innerHTML = (isBotMsg ? botLabel : nameLabel) + html;
                    box.appendChild(div);
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        // تنسيق نص البوت - مصحح للعربي
        function formatBotText(text) {
            if (!text) return '';
            // ننضف النص من أي حروف غريبة
            let h = text;
            // كود بلوك
            h = h.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
            // كود سطر
            h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
            // عريض
            h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            // عناوين
            h = h.replace(/^### (.+)$/gm, '<strong style="font-size:1.1em">$1</strong>');
            h = h.replace(/^## (.+)$/gm, '<strong style="font-size:1.2em">$1</strong>');
            h = h.replace(/^# (.+)$/gm, '<strong style="font-size:1.3em">$1</strong>');
            // قوائم
            h = h.replace(/^\d+\.\s+(.+)$/gm, '<div style="padding-right:15px">• $1</div>');
            h = h.replace(/^[-*]\s+(.+)$/gm, '<div style="padding-right:15px">• $1</div>');
            // أسطر جديدة - نحولها لbr
            h = h.replace(/\n\n/g, '<br><br>');
            h = h.replace(/\n/g, '<br>');
            return h;
        }

        // تنظيف نص المستخدم
        function escapeHTML(text) {
            if (!text) return '';
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
        }

        // =============================================
        // 7. الإرسال
        // =============================================
        async function saveMessageToDB(msgData) {
            if(!activeChat) return;
            const parent = chatType === 'group' ? 'groups' : 'chats';
            const id = chatType === 'group' ? activeChat.id : getChatId(activeChat.email);
            await addDoc(collection(db, parent, id, "messages"), { ...msgData, sender: currentUser.email, senderName: currentUser.name, time: serverTimestamp(), status: 'sent' });
        }

        window.sendMessage = async () => {
            const el = document.getElementById('msg-input'), txt = el.value.trim();
            if(!txt) return;
            const isBotChat = chatType === 'direct' && activeChat && activeChat.email === AI_BOT_EMAIL;
            if (isBotChat && isBotProcessing) return showToast("انتظر حتى يكمل KimoAI الرد...", "info");
            if (isBotChat && !isPremiumUser()) { const c = await getAIMsgCount(); if (c >= FREE_AI_LIMIT) return showToast(`استنفدت ${FREE_AI_LIMIT} رسائل KimoAI اليومية!`, "error"); }
            el.value = ""; document.getElementById('emoji-picker').style.display = 'none';
            await saveMessageToDB({ type: 'text', text: txt });
            if (isBotChat) { if (!isPremiumUser()) await incrementAIMsgCount(); handleBotResponse(); }
        };

        document.getElementById('msg-input').addEventListener('keypress', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });

        window.sendImageMsg = () => {
            const file = document.getElementById('chat-file-input').files[0];
            if(!file) return;
            const isBotChat = chatType === 'direct' && activeChat && activeChat.email === AI_BOT_EMAIL;
            const reader = new FileReader();
            reader.onloadend = async () => {
                if (isBotChat && !isPremiumUser()) { const c = await getAIMsgCount(); if (c >= FREE_AI_LIMIT) return showToast(`استنفدت ${FREE_AI_LIMIT} رسائل KimoAI اليومية!`, "error"); }
                showToast("جاري إرسال الصورة...", "info");
                const originalUrl = reader.result;
                await saveMessageToDB({ type: 'image', url: originalUrl });
                if (isBotChat) {
                    if (!isPremiumUser()) await incrementAIMsgCount();
                    const compressedUrl = await compressImageForAPI(originalUrl, 512, 0.5);
                    handleBotResponse(compressedUrl);
                }
            };
            reader.readAsDataURL(file);
        };

        const vBtn = document.getElementById('voice-btn');
        vBtn.onmousedown = async () => { try { const stream = await navigator.mediaDevices.getUserMedia({ audio: true }); mediaRecorder = new MediaRecorder(stream); mediaRecorder.start(); audioChunks = []; vBtn.classList.add('bg-red-500', 'text-white', 'animate-pulse'); mediaRecorder.ondataavailable = e => audioChunks.push(e.data); mediaRecorder.onstop = async () => { const blob = new Blob(audioChunks, { type: 'audio/mp3' }); const r = new FileReader(); r.readAsDataURL(blob); r.onloadend = async () => { await saveMessageToDB({ type: 'voice', audio: r.result }); }; }; } catch (e) { showToast("صلاحية الميكروفون مطلوبة", "error"); } };
        vBtn.onmouseup = () => { if(mediaRecorder && mediaRecorder.state === 'recording') { mediaRecorder.stop(); vBtn.classList.remove('bg-red-500', 'text-white', 'animate-pulse'); } };

        window.sendXGift = async () => {
            if(chatType !== 'direct' || (activeChat && activeChat.email === AI_BOT_EMAIL)) return;
            const amount = parseInt(prompt("كمية X داخل الدبدوب:"));
            if(isNaN(amount) || amount <= 0) return;
            if(currentUser.xCoins < amount) return showToast("رصيد غير كافٍ", "error");
            await updateDoc(doc(db, "users", currentUser.email), { xCoins: currentUser.xCoins - amount });
            await saveMessageToDB({ type: 'gift', amount, status: 'sent' }); showToast("تم إرسال الدبدوب!", "success");
        };

        window.claimGift = async (msgId, amount, isMe, status, collectionId) => {
            if (status === 'claimed') return showToast("تم الاستلام مسبقاً!", "error");
            if (isMe) return showToast("الهدية لصديقك!", "info");
            try { await updateDoc(doc(db, "users", currentUser.email), { xCoins: currentUser.xCoins + amount }); await updateDoc(doc(db, "chats", collectionId, "messages", msgId), { status: 'claimed' }); confetti({ particleCount: 300, spread: 150, origin: { y: 0.6 } }); showToast(`مبروك! استلمت ${amount} X`, "success"); } catch (e) { showToast("خطأ", "error"); }
        };

        // =============================================
        // 8. واجهة المستخدم
        // =============================================
        window.toggleEmoji = () => { const p = document.getElementById('emoji-picker'); p.style.display = p.style.display === 'grid' ? 'none' : 'grid'; };
        window.addEmoji = (e) => { const input = document.getElementById('msg-input'); input.value += e; input.focus(); };
        window.openSettings = () => {
            if(!currentUser) return;
            document.getElementById('set-name').value = currentUser.name; document.getElementById('set-badge').value = currentUser.badge || "";
            document.getElementById('preview-img').src = currentUser.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
            const pb = document.getElementById('premium-upgrade-btn'), pt = document.getElementById('premium-status-text');
            if (isPremiumUser()) { pb.classList.add('hidden'); pt.innerText = 'اشتراكك مفعّل - رسائل غير محدودة'; } else { pb.classList.remove('hidden'); pt.innerText = `رسائل غير محدودة - ${PREMIUM_COST} X`; }
            document.getElementById('modal-settings').classList.remove('hidden');
        };
        window.previewAvatar = () => { const file = document.getElementById('avatar-input').files[0]; if(file) { const reader = new FileReader(); reader.onloadend = () => { base64Avatar = reader.result; document.getElementById('preview-img').src = base64Avatar; }; reader.readAsDataURL(file); } };
        window.updateProfile = async () => { const name = document.getElementById('set-name').value, badge = document.getElementById('set-badge').value, u = { name, badge }; if (base64Avatar) u.avatar = base64Avatar; await updateDoc(doc(db, "users", currentUser.email), u); closeModals(); showToast("تم التحديث!", "success"); };
        window.toggleAdminPanel = () => document.getElementById('admin-panel').classList.toggle('hidden');
        window.closeModals = () => document.querySelectorAll('[id^="modal-"], #admin-panel').forEach(m => m.classList.add('hidden'));
        window.adminAction = async (type) => {
            const email = document.getElementById('admin-user').value.trim();
            if (!email) return showToast("أدخل إيميل المستخدم", "error");
            const ref = doc(db, "users", email), snap = await getDoc(ref);
            if(!snap.exists()) return showToast("المستخدم غير موجود", "error");
            if(type === 'coins') { const v = parseInt(document.getElementById('admin-amount').value); if (isNaN(v) || v <= 0) return showToast("كمية غير صحيحة", "error"); await updateDoc(ref, { xCoins: (snap.data().xCoins || 0) + v }); showToast(`تم شحن ${v} X`, "success"); }
            else if (type === 'premium') { const c = snap.data().isPremium || false; await updateDoc(ref, { isPremium: !c }); showToast(`تم ${c ? 'إزالة' : 'منح'} البريميوم`, "success"); }
            else if (type === 'resetAI') { await updateDoc(ref, { aiMsgCount: 0, aiMsgResetDate: "" }); showToast("تم التصفير", "success"); }
        };

        renderSidebarActionArea();
    </script>
</body>
</html>
