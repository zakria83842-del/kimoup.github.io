<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KimoUp | النسخة الاحترافية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --main: #4f46e5; --bg: #f3f4f6; }
        body { background-color: var(--bg); font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; }
        .kimo-gradient { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); }
        .chat-pattern { background-image: url('https://www.transparenttextures.com/patterns/carbon-fibre.png'); opacity: 0.05; position: absolute; inset: 0; z-index: 0; }
        .msg-bubble { position: relative; z-index: 10; transition: all 0.2s; }
        .voice-wave { display: inline-block; width: 3px; background: #6366f1; margin: 0 1px; animation: wave 1s infinite ease-in-out; }
        @keyframes wave { 0%, 100% { height: 5px; } 50% { height: 15px; } }
    </style>
</head>
<body class="h-screen flex items-center justify-center">

    <div id="auth-container" class="z-50 w-full max-w-md p-10 bg-white rounded-[3rem] shadow-2xl mx-4 text-center">
        <div class="w-20 h-20 kimo-gradient rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-xl">
            <i class="fa-solid fa-bolt-lightning text-white text-4xl"></i>
        </div>
        <h1 class="text-3xl font-black text-gray-800">KimoUp</h1>
        <div class="mt-8 space-y-3">
            <input type="email" id="email" placeholder="البريد الإلكتروني" class="w-full p-4 bg-gray-100 rounded-2xl outline-none focus:ring-2 ring-indigo-500 text-right">
            <input type="password" id="password" placeholder="كلمة المرور" class="w-full p-4 bg-gray-100 rounded-2xl outline-none focus:ring-2 ring-indigo-500 text-right">
            <button onclick="handleSignIn()" class="w-full kimo-gradient text-white p-4 rounded-2xl font-bold shadow-lg hover:opacity-90 transition">دخول</button>
            <button onclick="handleSignUp()" class="text-xs text-indigo-600 font-bold">إنشاء حساب جديد</button>
        </div>
    </div>

    <div id="app-container" class="hidden w-full h-screen flex bg-white overflow-hidden">
        <div class="w-80 border-l flex flex-col bg-white z-10 shadow-xl">
            <div class="p-6 kimo-gradient text-white">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold tracking-tighter">KIMOUP</h2>
                    <div class="flex gap-2">
                        <button onclick="openSettings()" class="w-8 h-8 bg-white/20 rounded-lg flex items-center justify-center"><i class="fa-solid fa-gear"></i></button>
                        <button id="admin-btn" onclick="toggleAdminPanel()" class="hidden w-8 h-8 bg-yellow-400 text-indigo-900 rounded-lg flex items-center justify-center shadow-lg"><i class="fa-solid fa-crown"></i></button>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <img id="user-img" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="w-14 h-14 rounded-2xl border-2 border-white/30 object-cover">
                    <div>
                        <div class="flex items-center gap-1">
                            <p id="user-name-display" class="font-bold">تحميل...</p>
                        </div>
                        <p id="user-x-balance" class="text-xs text-yellow-300 font-black">X: 0</p>
                    </div>
                </div>
            </div>

            <div class="p-4 bg-indigo-50 flex gap-2">
                <input type="email" id="target-email" placeholder="أضف صديق بالإيميل" class="flex-1 p-2 text-xs rounded-xl outline-none border-none">
                <button onclick="addNewContact()" class="bg-indigo-600 text-white px-3 rounded-xl"><i class="fa-solid fa-user-plus"></i></button>
            </div>

            <div id="contacts-list" class="flex-1 overflow-y-auto">
                </div>
        </div>

        <div class="flex-1 flex flex-col relative bg-gray-100">
            <div class="chat-pattern"></div>
            
            <div id="welcome-screen" class="absolute inset-0 flex flex-col items-center justify-center text-gray-400 z-10">
                <i class="fa-solid fa-comment-dots text-6xl mb-4 opacity-20"></i>
                <p class="font-bold opacity-30">اختر محادثة للبدء</p>
            </div>

            <div id="chat-ui" class="hidden h-full flex flex-col relative z-10">
                <div class="p-4 bg-white/80 backdrop-blur shadow-sm flex justify-between items-center px-8 border-b">
                    <div class="flex items-center gap-3">
                        <img id="target-img" src="" class="w-10 h-10 rounded-full object-cover bg-gray-200">
                        <h3 id="target-name" class="font-black text-gray-800">...</h3>
                    </div>
                    <button onclick="sendXGift()" class="bg-yellow-100 text-yellow-700 px-4 py-2 rounded-xl text-xs font-bold hover:bg-yellow-200 transition">
                        <i class="fa-solid fa-gift"></i> إرسال هدية
                    </button>
                </div>

                <div id="messages-area" class="flex-1 p-6 overflow-y-auto flex flex-col gap-4"></div>

                <div class="p-6 flex gap-3 items-center px-8">
                    <button id="voice-btn" class="w-12 h-12 bg-gray-200 text-gray-600 rounded-2xl flex items-center justify-center transition active:bg-red-500 active:text-white">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                    <input type="text" id="msg-input" placeholder="اكتب هنا..." class="flex-1 p-4 rounded-2xl shadow-xl outline-none focus:ring-2 ring-indigo-500 border-none">
                    <button onclick="sendTextMessage()" class="w-14 h-14 kimo-gradient text-white rounded-2xl shadow-xl flex items-center justify-center"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-settings" class="hidden fixed inset-0 bg-black/60 z-[200] flex items-center justify-center p-4 backdrop-blur">
        <div class="bg-white p-8 rounded-[2.5rem] w-full max-w-sm shadow-2xl">
            <h2 class="text-xl font-black mb-6">تعديل البروفايل</h2>
            <div class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-gray-400">الاسم المستعار</label>
                    <input type="text" id="set-name" class="w-full p-3 bg-gray-100 rounded-xl outline-none mt-1">
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-400">رابط الصورة (URL)</label>
                    <input type="text" id="set-avatar" class="w-full p-3 bg-gray-100 rounded-xl outline-none mt-1">
                </div>
                <button onclick="updateProfile()" class="w-full kimo-gradient text-white p-3 rounded-xl font-bold mt-4">حفظ التغييرات</button>
                <button onclick="closeModals()" class="w-full text-gray-400 text-sm">إغلاق</button>
            </div>
        </div>
    </div>

    <div id="admin-panel" class="hidden fixed inset-0 bg-black/60 z-[200] flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-[2.5rem] w-full max-w-md">
            <h2 class="text-xl font-black mb-4 flex items-center gap-2"><i class="fa-solid fa-shield-cat"></i> لوحة الأدمن</h2>
            <input type="email" id="admin-user" placeholder="إيميل المستخدم" class="w-full p-3 bg-gray-100 rounded-xl mb-4">
            <div class="flex gap-2">
                <input type="number" id="admin-amount" placeholder="X Coins" class="flex-1 p-3 bg-gray-100 rounded-xl">
                <button onclick="adminAction('coins')" class="bg-yellow-500 text-white px-6 rounded-xl font-bold">شحن</button>
            </div>
            <button onclick="adminAction('premium')" class="w-full bg-indigo-900 text-white p-3 rounded-xl font-bold mt-3">تفعيل بريميوم</button>
            <button onclick="closeModals()" class="w-full mt-4 text-gray-400">خروج</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, query, orderBy, onSnapshot, addDoc, serverTimestamp, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyDEF8YAXmkV5t7scY1St2GDliQueOXGEsc", 
            authDomain: "telekimo-36af6.firebaseapp.com", 
            projectId: "telekimo-36af6", 
            storageBucket: "telekimo-36af6.firebasestorage.app", 
            messagingSenderId: "430737934562", 
            appId: "1:430737934562:web:22eb31d1fd4742826776bb" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let activeChat = null;
        let mediaRecorder;
        let audioChunks = [];

        // --- Auth Logic ---
        window.handleSignIn = async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            try {
                // Admin Special Pass
                if(email === "kareemwael0216@gmail.com" && pass === "K_425422") {
                    enterApp({ email, isAdmin: true });
                } else {
                    const res = await signInWithEmailAndPassword(auth, email, pass);
                    enterApp(res.user);
                }
            } catch (e) { alert("خطأ في البيانات"); }
        };

        window.handleSignUp = async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            try {
                const res = await createUserWithEmailAndPassword(auth, email, pass);
                await setDoc(doc(db, "users", email), {
                    email, name: email.split('@')[0], avatar: "", xCoins: 0, isPremium: false, contacts: []
                });
                alert("تم إنشاء الحساب! سجل دخولك الآن.");
            } catch (e) { alert("خطأ في التسجيل"); }
        };

        function enterApp(user) {
            document.getElementById('auth-container').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');

            // Listen for User Data
            onSnapshot(doc(db, "users", user.email), (snap) => {
                if(!snap.exists()) return;
                currentUser = snap.data();
                if(user.isAdmin) currentUser.isAdmin = true;

                document.getElementById('user-name-display').innerText = currentUser.name;
                document.getElementById('user-x-balance').innerText = `X: ${currentUser.xCoins}`;
                if(currentUser.avatar) document.getElementById('user-img').src = currentUser.avatar;
                
                // Show Admin Button
                if(currentUser.isAdmin) document.getElementById('admin-btn').classList.remove('hidden');

                loadContacts(currentUser.contacts || []);
            });
        }

        // --- Profile & Contacts ---
        window.openSettings = () => {
            document.getElementById('set-name').value = currentUser.name;
            document.getElementById('set-avatar').value = currentUser.avatar;
            document.getElementById('modal-settings').classList.remove('hidden');
        };

        window.updateProfile = async () => {
            const newName = document.getElementById('set-name').value;
            const newAvatar = document.getElementById('set-avatar').value;
            await updateDoc(doc(db, "users", currentUser.email), { name: newName, avatar: newAvatar });
            closeModals();
        };

        window.addNewContact = async () => {
            const email = document.getElementById('target-email').value;
            if(!email || email === currentUser.email) return;
            const check = await getDoc(doc(db, "users", email));
            if(check.exists()) {
                await updateDoc(doc(db, "users", currentUser.email), { contacts: arrayUnion(email) });
                document.getElementById('target-email').value = "";
            } else { alert("المستخدم غير موجود"); }
        };

        function loadContacts(list) {
            const container = document.getElementById('contacts-list');
            container.innerHTML = "";
            list.forEach(async (email) => {
                const uDoc = await getDoc(doc(db, "users", email));
                const data = uDoc.data();
                const div = document.createElement('div');
                div.className = "flex items-center gap-3 p-4 hover:bg-gray-50 cursor-pointer border-b border-gray-50 transition";
                div.innerHTML = `
                    <img src="${data.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" class="w-10 h-10 rounded-full object-cover">
                    <div>
                        <p class="text-sm font-bold">${data.name} ${data.isPremium ? '⭐' : ''}</p>
                        <p class="text-[10px] text-gray-400">انقر للمحادثة</p>
                    </div>
                `;
                div.onclick = () => startChat(data);
                container.appendChild(div);
            });
        }

        // --- Chat & Voice ---
        function startChat(target) {
            activeChat = target;
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('chat-ui').classList.remove('hidden');
            document.getElementById('target-name').innerText = target.name;
            document.getElementById('target-img').src = target.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
            loadMessages();
        }

        function loadMessages() {
            const chatId = [currentUser.email, activeChat.email].sort().join('_');
            const q = query(collection(db, "chats", chatId, "messages"), orderBy("time", "asc"));
            onSnapshot(q, (snap) => {
                const box = document.getElementById('messages-area');
                box.innerHTML = "";
                snap.forEach(mDoc => {
                    const m = mDoc.data();
                    const isMe = m.sender === currentUser.email;
                    const div = document.createElement('div');
                    div.className = `msg-bubble max-w-[80%] p-4 rounded-3xl text-sm ${isMe ? 'self-end bg-indigo-600 text-white' : 'self-start bg-white shadow-sm text-gray-800'}`;
                    
                    if(m.type === 'voice') {
                        div.innerHTML = `<audio controls src="${m.audio}" class="w-48 h-8"></audio>`;
                    } else if(m.type === 'gift') {
                        div.className = "self-center bg-yellow-400 p-4 rounded-3xl font-black text-xs shadow-lg flex items-center gap-2";
                        div.innerHTML = `🎁 هدية من ${m.senderName}: +${m.amount} X`;
                    } else {
                        div.innerText = m.text;
                    }
                    box.appendChild(div);
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        window.sendTextMessage = async () => {
            const txt = document.getElementById('msg-input').value;
            if(!txt || !activeChat) return;
            const chatId = [currentUser.email, activeChat.email].sort().join('_');
            await addDoc(collection(db, "chats", chatId, "messages"), {
                sender: currentUser.email, text: txt, type: 'text', time: serverTimestamp()
            });
            document.getElementById('msg-input').value = "";
        };

        // --- Voice Logic ---
        const vBtn = document.getElementById('voice-btn');
        vBtn.onmousedown = async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.start();
            audioChunks = [];
            vBtn.classList.add('bg-red-500', 'text-white');
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                const reader = new FileReader();
                reader.readAsDataURL(audioBlob);
                reader.onloadend = async () => {
                    const base64 = reader.result;
                    const chatId = [currentUser.email, activeChat.email].sort().join('_');
                    await addDoc(collection(db, "chats", chatId, "messages"), {
                        sender: currentUser.email, audio: base64, type: 'voice', time: serverTimestamp()
                    });
                };
            };
        };
        vBtn.onmouseup = () => {
            mediaRecorder.stop();
            vBtn.classList.remove('bg-red-500', 'text-white');
        };

        // --- Admin & Gifts ---
        window.sendXGift = async () => {
            const amount = parseInt(prompt("الكمية:"));
            if(isNaN(amount) || currentUser.xCoins < amount) return alert("رصيد غير كافٍ");
            const chatId = [currentUser.email, activeChat.email].sort().join('_');
            
            await updateDoc(doc(db, "users", currentUser.email), { xCoins: currentUser.xCoins - amount });
            const tSnap = await getDoc(doc(db, "users", activeChat.email));
            await updateDoc(doc(db, "users", activeChat.email), { xCoins: (tSnap.data().xCoins || 0) + amount });

            await addDoc(collection(db, "chats", chatId, "messages"), {
                sender: currentUser.email, senderName: currentUser.name, amount, type: 'gift', time: serverTimestamp()
            });
            confetti({ particleCount: 100 });
        };

        window.adminAction = async (type) => {
            const target = document.getElementById('admin-user').value;
            const ref = doc(db, "users", target);
            if(type === 'coins') {
                const val = parseInt(document.getElementById('admin-amount').value);
                const s = await getDoc(ref);
                await updateDoc(ref, { xCoins: (s.data().xCoins || 0) + val });
                alert("تم!");
            } else {
                await updateDoc(ref, { isPremium: true });
                alert("تم التفعيل!");
            }
        };

        window.toggleAdminPanel = () => document.getElementById('admin-panel').classList.toggle('hidden');
        window.closeModals = () => {
            document.querySelectorAll('[id^="modal-"], #admin-panel').forEach(m => m.classList.add('hidden'));
        };
    </script>
</body>
</html>
