<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KimoUp | كيمو أب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --main: #6366f1; --bg: #f8fafc; }
        body { background-color: var(--bg); font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; }
        .kimo-gradient { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
        .chat-pattern { background-image: url('https://www.transparenttextures.com/patterns/cubes.png'); opacity: 0.05; position: absolute; inset: 0; z-index: 0; }
        .msg-bubble { position: relative; z-index: 10; transition: all 0.2s; }
        audio::-webkit-media-controls-panel { background-color: #f1f5f9; }
    </style>
</head>
<body class="h-screen flex items-center justify-center">

    <div id="auth-container" class="z-50 w-full max-w-md p-10 bg-white rounded-[3rem] shadow-2xl mx-4 text-center">
        <div class="w-20 h-20 kimo-gradient rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-xl rotate-3">
            <i class="fa-solid fa-rocket text-white text-4xl"></i>
        </div>
        <h1 class="text-3xl font-black text-gray-800">KimoUp</h1>
        <div class="mt-8 space-y-3">
            <input type="email" id="email" placeholder="البريد الإلكتروني" class="w-full p-4 bg-gray-50 rounded-2xl outline-none focus:ring-2 ring-indigo-500 text-right">
            <input type="password" id="password" placeholder="كلمة المرور" class="w-full p-4 bg-gray-50 rounded-2xl outline-none focus:ring-2 ring-indigo-500 text-right">
            <button onclick="handleSignIn()" class="w-full kimo-gradient text-white p-4 rounded-2xl font-bold shadow-lg hover:opacity-90 transition">دخول</button>
            <button onclick="handleSignUp()" class="text-xs text-indigo-600 font-bold">إنشاء حساب جديد</button>
        </div>
    </div>

    <div id="app-container" class="hidden w-full h-screen flex bg-white overflow-hidden">
        <div class="w-80 border-l flex flex-col bg-white z-10 shadow-xl">
            <div class="p-6 kimo-gradient text-white">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold tracking-tighter">KIMOUP</h2>
                    <div class="flex gap-2">
                        <button onclick="openSettings()" class="w-8 h-8 bg-white/20 rounded-lg flex items-center justify-center hover:bg-white/40 transition"><i class="fa-solid fa-gear"></i></button>
                        <button id="admin-btn" onclick="toggleAdminPanel()" class="hidden w-8 h-8 bg-yellow-400 text-indigo-900 rounded-lg flex items-center justify-center shadow-lg"><i class="fa-solid fa-crown"></i></button>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <img id="user-img" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="w-14 h-14 rounded-2xl border-2 border-white/30 object-cover shadow-md">
                    <div>
                        <p id="user-name-display" class="font-bold">تحميل...</p>
                        <p id="user-x-balance" class="text-xs text-yellow-300 font-black tracking-wider">X: 0</p>
                    </div>
                </div>
            </div>

            <div class="p-4 bg-indigo-50 flex gap-2">
                <input type="email" id="target-email" placeholder="أضف صديق بالإيميل" class="flex-1 p-3 text-xs rounded-xl outline-none border-none shadow-inner">
                <button onclick="addNewContact()" class="bg-indigo-600 text-white px-4 rounded-xl hover:bg-indigo-700 transition shadow-md"><i class="fa-solid fa-user-plus"></i></button>
            </div>

            <div id="contacts-list" class="flex-1 overflow-y-auto bg-white">
                </div>
            
            <button onclick="handleSignOut()" class="p-4 text-[10px] text-red-400 font-bold border-t hover:bg-red-50 transition">تسجيل الخروج</button>
        </div>

        <div class="flex-1 flex flex-col relative bg-gray-50">
            <div class="chat-pattern"></div>
            
            <div id="welcome-screen" class="absolute inset-0 flex flex-col items-center justify-center text-gray-400 z-10">
                <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center shadow-sm mb-4">
                    <i class="fa-solid fa-comments text-4xl opacity-20"></i>
                </div>
                <p class="font-bold opacity-30 tracking-widest uppercase text-xs">اختر محادثة للبدء</p>
            </div>

            <div id="chat-ui" class="hidden h-full flex flex-col relative z-10">
                <div class="p-4 bg-white/90 backdrop-blur shadow-sm flex justify-between items-center px-8 border-b">
                    <div class="flex items-center gap-3">
                        <img id="target-img" src="" class="w-10 h-10 rounded-xl object-cover bg-gray-200">
                        <h3 id="target-name" class="font-black text-gray-800">...</h3>
                    </div>
                    <button onclick="sendXGift()" class="bg-amber-100 text-amber-700 px-4 py-2 rounded-xl text-xs font-bold hover:bg-amber-200 transition flex items-center gap-2">
                        <i class="fa-solid fa-gift"></i> إرسال هدية
                    </button>
                </div>

                <div id="messages-area" class="flex-1 p-6 overflow-y-auto flex flex-col gap-4"></div>

                <div class="p-6 flex gap-3 items-center px-8 bg-white/50 backdrop-blur">
                    <button id="voice-btn" class="w-12 h-12 bg-white text-gray-400 rounded-2xl flex items-center justify-center shadow-lg transition active:scale-90">
                        <i class="fa-solid fa-microphone text-xl"></i>
                    </button>
                    <input type="text" id="msg-input" placeholder="اكتب رسالة..." class="flex-1 p-4 rounded-2xl shadow-xl outline-none focus:ring-2 ring-indigo-500 border-none bg-white">
                    <button onclick="sendTextMessage()" class="w-14 h-14 kimo-gradient text-white rounded-2xl shadow-xl flex items-center justify-center hover:scale-105 transition active:scale-95"><i class="fa-solid fa-paper-plane text-xl"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-settings" class="hidden fixed inset-0 bg-black/60 z-[200] flex items-center justify-center p-4 backdrop-blur-md">
        <div class="bg-white p-8 rounded-[2.5rem] w-full max-w-sm shadow-2xl">
            <h2 class="text-xl font-black mb-6 flex items-center gap-2"><i class="fa-solid fa-user-pen text-indigo-600"></i> تعديل البروفايل</h2>
            <div class="space-y-4">
                <input type="text" id="set-name" placeholder="الاسم المستعار" class="w-full p-4 bg-gray-50 rounded-2xl outline-none border-none">
                <input type="text" id="set-avatar" placeholder="رابط صورة البروفايل (URL)" class="w-full p-4 bg-gray-50 rounded-2xl outline-none border-none text-xs">
                <button onclick="updateProfile()" class="w-full kimo-gradient text-white p-4 rounded-2xl font-bold shadow-lg">حفظ البيانات</button>
                <button onclick="closeModals()" class="w-full text-gray-400 text-sm font-bold">إلغاء</button>
            </div>
        </div>
    </div>

    <div id="admin-panel" class="hidden fixed inset-0 bg-black/60 z-[200] flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-[2.5rem] w-full max-w-md shadow-2xl">
            <h2 class="text-xl font-black mb-6"><i class="fa-solid fa-shield-halved text-red-500"></i> تحكم الأدمن</h2>
            <div class="space-y-4">
                <input type="email" id="admin-user" placeholder="إيميل المستخدم المستهدف" class="w-full p-4 bg-gray-50 rounded-2xl outline-none">
                <div class="flex gap-2">
                    <input type="number" id="admin-amount" placeholder="كمية X" class="flex-1 p-4 bg-gray-50 rounded-2xl outline-none">
                    <button onclick="adminAction('coins')" class="bg-yellow-500 text-white px-8 rounded-2xl font-bold shadow-md">شحن</button>
                </div>
                <button onclick="adminAction('premium')" class="w-full bg-indigo-900 text-white p-4 rounded-2xl font-bold hover:bg-black transition">تفعيل بريميوم ⭐</button>
                <button onclick="closeModals()" class="w-full text-gray-400 font-bold">خروج</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, query, orderBy, onSnapshot, addDoc, serverTimestamp, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyDEF8YAXmkV5t7scY1St2GDliQueOXGEsc", 
            authDomain: "telekimo-36af6.firebaseapp.com", 
            projectId: "telekimo-36af6", 
            storageBucket: "telekimo-36af6.firebasestorage.app", 
            messagingSenderId: "430737934562", 
            appId: "1:430737934562:web:22eb31d1fd4742826776bb" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let activeChat = null;
        let mediaRecorder;
        let audioChunks = [];

        // --- Core Authentication ---
        async function enterApp(userEmail, isAdmin = false) {
            const userRef = doc(db, "users", userEmail);
            const snap = await getDoc(userRef);

            // Create user document if it doesn't exist
            if (!snap.exists()) {
                await setDoc(userRef, {
                    email: userEmail,
                    name: userEmail.split('@')[0],
                    avatar: "",
                    xCoins: 0,
                    isPremium: isAdmin,
                    contacts: []
                });
            }

            document.getElementById('auth-container').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');

            onSnapshot(userRef, (docSnap) => {
                if(!docSnap.exists()) return;
                currentUser = docSnap.data();
                if (isAdmin) currentUser.isAdmin = true;

                document.getElementById('user-name-display').innerText = currentUser.name;
                document.getElementById('user-x-balance').innerText = `X: ${currentUser.xCoins || 0}`;
                if (currentUser.avatar) document.getElementById('user-img').src = currentUser.avatar;
                if (currentUser.isAdmin) document.getElementById('admin-btn').classList.remove('hidden');

                loadContacts(currentUser.contacts || []);
            });
        }

        window.handleSignIn = async () => {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;
            if(!email || !pass) return alert("املا البيانات");
            try {
                if (email === "kareemwael0216@gmail.com" && pass === "K_425422") {
                    await enterApp(email, true);
                } else {
                    const res = await signInWithEmailAndPassword(auth, email, pass);
                    await enterApp(res.user.email, false);
                }
            } catch (e) { alert("بيانات خاطئة أو المستخدم غير موجود"); }
        };

        window.handleSignUp = async () => {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;
            try {
                await createUserWithEmailAndPassword(auth, email, pass);
                await setDoc(doc(db, "users", email), {
                    email, name: email.split('@')[0], avatar: "", xCoins: 0, isPremium: false, contacts: []
                });
                alert("تم الإنشاء بنجاح! سجل دخولك الآن.");
            } catch (e) { alert("خطأ في التسجيل"); }
        };

        // --- Contacts Logic ---
        window.addNewContact = async () => {
            if (!currentUser) return;
            const targetEmail = document.getElementById('target-email').value.trim();
            if(!targetEmail || targetEmail === currentUser.email) return alert("إيميل غير صالح");

            const check = await getDoc(doc(db, "users", targetEmail));
            if(check.exists()) {
                await updateDoc(doc(db, "users", currentUser.email), { contacts: arrayUnion(targetEmail) });
                document.getElementById('target-email').value = "";
                alert("تمت الإضافة!");
            } else { alert("هذا الإيميل غير مسجل في البرنامج"); }
        };

        async function loadContacts(list) {
            const container = document.getElementById('contacts-list');
            container.innerHTML = "";
            for (const email of list) {
                const uDoc = await getDoc(doc(db, "users", email));
                if(uDoc.exists()) {
                    const data = uDoc.data();
                    const div = document.createElement('div');
                    div.className = "flex items-center gap-4 p-4 hover:bg-indigo-50 cursor-pointer border-b border-gray-50 transition";
                    div.innerHTML = `
                        <img src="${data.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" class="w-11 h-11 rounded-xl object-cover shadow-sm bg-gray-100">
                        <div class="flex-1">
                            <p class="text-sm font-bold text-gray-700">${data.name} ${data.isPremium ? '⭐' : ''}</p>
                            <p class="text-[9px] text-gray-400 font-medium">متاح للمراسلة</p>
                        </div>
                    `;
                    div.onclick = () => startChat(data);
                    container.appendChild(div);
                }
            }
        }

        // --- Profile & UI ---
        window.openSettings = () => {
            if(!currentUser) return;
            document.getElementById('set-name').value = currentUser.name;
            document.getElementById('set-avatar').value = currentUser.avatar;
            document.getElementById('modal-settings').classList.remove('hidden');
        };

        window.updateProfile = async () => {
            const name = document.getElementById('set-name').value;
            const avatar = document.getElementById('set-avatar').value;
            await updateDoc(doc(db, "users", currentUser.email), { name, avatar });
            closeModals();
        };

        // --- Chat & Voice System ---
        function startChat(target) {
            activeChat = target;
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('chat-ui').classList.remove('hidden');
            document.getElementById('target-name').innerText = target.name;
            document.getElementById('target-img').src = target.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
            loadMessages();
        }

        function loadMessages() {
            const chatId = [currentUser.email, activeChat.email].sort().join('_');
            const q = query(collection(db, "chats", chatId, "messages"), orderBy("time", "asc"));
            onSnapshot(q, (snap) => {
                const box = document.getElementById('messages-area');
                box.innerHTML = "";
                snap.forEach(mDoc => {
                    const m = mDoc.data();
                    const isMe = m.sender === currentUser.email;
                    const div = document.createElement('div');
                    
                    if(m.type === 'voice') {
                        div.className = `max-w-[85%] p-2 rounded-2xl ${isMe ? 'self-end bg-indigo-100' : 'self-start bg-white shadow-sm'}`;
                        div.innerHTML = `<audio controls src="${m.audio}" class="h-8 w-48"></audio>`;
                    } else if(m.type === 'gift') {
                        div.className = "self-center bg-gradient-to-r from-amber-400 to-orange-500 text-white p-4 rounded-[2rem] font-black text-[10px] shadow-xl my-2 flex items-center gap-2";
                        div.innerHTML = `<i class="fa-solid fa-gift"></i> هدية من ${m.senderName}: +${m.amount} X Coins`;
                    } else {
                        div.className = `max-w-[75%] p-4 rounded-[1.5rem] text-sm shadow-sm ${isMe ? 'self-end bg-indigo-600 text-white' : 'self-start bg-white text-gray-800'}`;
                        div.innerText = m.text;
                    }
                    box.appendChild(div);
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        window.sendTextMessage = async () => {
            const txt = document.getElementById('msg-input').value.trim();
            if(!txt || !activeChat) return;
            const chatId = [currentUser.email, activeChat.email].sort().join('_');
            await addDoc(collection(db, "chats", chatId, "messages"), {
                sender: currentUser.email, text: txt, type: 'text', time: serverTimestamp()
            });
            document.getElementById('msg-input').value = "";
        };

        // --- Voice Recording ---
        const vBtn = document.getElementById('voice-btn');
        vBtn.onmousedown = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.start();
                audioChunks = [];
                vBtn.classList.add('bg-red-500', 'text-white', 'animate-pulse');
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = async () => {
                        const chatId = [currentUser.email, activeChat.email].sort().join('_');
                        await addDoc(collection(db, "chats", chatId, "messages"), {
                            sender: currentUser.email, audio: reader.result, type: 'voice', time: serverTimestamp()
                        });
                    };
                };
            } catch (e) { alert("يجب تفعيل سماح الميكروفون"); }
        };
        vBtn.onmouseup = () => {
            if(mediaRecorder) {
                mediaRecorder.stop();
                vBtn.classList.remove('bg-red-500', 'text-white', 'animate-pulse');
            }
        };

        // --- Gifts & Admin ---
        window.sendXGift = async () => {
            const amount = parseInt(prompt("أدخل كمية العملات للهديّة:"));
            if(isNaN(amount) || amount <= 0 || currentUser.xCoins < amount) return alert("رصيد غير كافٍ أو مبلغ خاطئ");
            
            const chatId = [currentUser.email, activeChat.email].sort().join('_');
            await updateDoc(doc(db, "users", currentUser.email), { xCoins: currentUser.xCoins - amount });
            const targetRef = doc(db, "users", activeChat.email);
            const targetSnap = await getDoc(targetRef);
            await updateDoc(targetRef, { xCoins: (targetSnap.data().xCoins || 0) + amount });

            await addDoc(collection(db, "chats", chatId, "messages"), {
                sender: currentUser.email, senderName: currentUser.name, amount, type: 'gift', time: serverTimestamp()
            });
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
        };

        window.adminAction = async (type) => {
            const email = document.getElementById('admin-user').value.trim();
            const ref = doc(db, "users", email);
            const snap = await getDoc(ref);
            if(!snap.exists()) return alert("المستخدم غير موجود");

            if(type === 'coins') {
                const val = parseInt(document.getElementById('admin-amount').value);
                await updateDoc(ref, { xCoins: (snap.data().xCoins || 0) + val });
                alert("تم الشحن!");
            } else {
                await updateDoc(ref, { isPremium: true });
                alert("تم التفعيل!");
            }
        };

        window.toggleAdminPanel = () => document.getElementById('admin-panel').classList.toggle('hidden');
        window.closeModals = () => {
            document.getElementById('modal-settings').classList.add('hidden');
            document.getElementById('admin-panel').classList.add('hidden');
        };
        window.handleSignOut = () => { signOut(auth).then(() => location.reload()); };
    </script>
</body>
</html>
