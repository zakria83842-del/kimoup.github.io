<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <title>KimoUp - النسخة النهائية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --main: #4f46e5; --bg: #f8fafc; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); overflow: hidden; margin: 0; height: 100vh; width: 100vw; }
        
        /* Sidebar System */
        #sidebar { transition: transform 0.3s ease-in-out; z-index: 50; }
        @media (max-width: 768px) {
            #sidebar { position: fixed; right: 0; top: 0; bottom: 0; width: 80%; transform: translateX(100%); }
            #sidebar.open { transform: translateX(0); }
            #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 40; backdrop-filter: blur(4px); }
            #overlay.active { display: block; }
        }

        .kimo-gradient { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); }
        .msg-bubble { max-width: 85%; padding: 12px 16px; border-radius: 20px; font-size: 14px; position: relative; margin-bottom: 8px; line-height: 1.5; }
        .msg-me { background: #4f46e5; color: white; align-self: flex-end; border-bottom-right-radius: 4px; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2); }
        .msg-them { background: white; color: #1e293b; align-self: flex-start; border-bottom-left-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        
        .nav-tab { flex: 1; text-align: center; padding: 12px; cursor: pointer; border-bottom: 2px solid transparent; transition: 0.3s; color: #64748b; font-weight: bold; }
        .nav-tab.active { color: #4f46e5; border-bottom-color: #4f46e5; background: rgba(79, 70, 229, 0.05); }

        /* Custom Scrollbar */
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="flex bg-slate-50">

    <!-- نظام التنبيهات -->
    <div id="toast-box" class="fixed top-5 left-1/2 -translate-x-1/2 z-[1000] space-y-2 pointer-events-none"></div>

    <!-- شاشة التحميل -->
    <div id="loader" class="fixed inset-0 bg-white z-[999] flex flex-col items-center justify-center">
        <div class="w-12 h-12 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-indigo-600 font-bold animate-pulse">جاري الاتصال بالسيرفر...</p>
    </div>

    <!-- شاشة الدخول -->
    <div id="auth-screen" class="hidden fixed inset-0 bg-indigo-600 z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] p-8 shadow-2xl text-center">
            <div class="w-20 h-20 kimo-gradient rounded-3xl mx-auto mb-6 flex items-center justify-center text-white text-4xl shadow-xl">
                <i class="fa-solid fa-bolt"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-800 mb-2">مرحباً بك في KimoUp</h1>
            <p class="text-slate-400 mb-8 text-sm">سجل دخولك للتواصل مع أصدقائك</p>
            <div class="space-y-4">
                <input type="email" id="auth-email" placeholder="البريد الإلكتروني" class="w-full p-4 bg-slate-50 border-none rounded-2xl outline-none focus:ring-2 ring-indigo-500 text-right">
                <input type="password" id="auth-pass" placeholder="كلمة المرور" class="w-full p-4 bg-slate-50 border-none rounded-2xl outline-none focus:ring-2 ring-indigo-500 text-right">
                <button onclick="handleAuth('login')" id="btn-login" class="w-full py-4 kimo-gradient text-white rounded-2xl font-bold shadow-lg hover:opacity-90 transition">دخول</button>
                <button onclick="handleAuth('register')" class="text-indigo-600 font-bold text-sm">إنشاء حساب جديد</button>
            </div>
        </div>
    </div>

    <!-- التطبيق الرئيسي -->
    <div id="main-app" class="hidden w-full h-screen flex relative overflow-hidden">
        <div id="overlay" onclick="toggleSidebar()"></div>
        
        <!-- القائمة الجانبية -->
        <aside id="sidebar" class="w-full md:w-80 lg:w-96 bg-white border-l flex flex-col shadow-xl">
            <!-- الهيدر الشخصي -->
            <div class="p-6 border-b">
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 kimo-gradient rounded-lg flex items-center justify-center text-white font-black">K</div>
                        <span class="text-xl font-black text-indigo-600">KimoUp</span>
                    </div>
                    <div class="flex gap-2">
                        <button id="admin-trigger" onclick="openModal('modal-admin')" class="hidden w-10 h-10 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center shadow-sm">
                            <i class="fa-solid fa-crown"></i>
                        </button>
                        <button onclick="openModal('modal-settings')" class="w-10 h-10 bg-slate-50 text-slate-500 rounded-xl flex items-center justify-center shadow-sm">
                            <i class="fa-solid fa-gear"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center gap-4 p-3 bg-indigo-50/50 rounded-2xl border border-indigo-100/50">
                    <img id="my-avatar" src="https://ui-avatars.com/api/?name=User" class="w-14 h-14 rounded-2xl object-cover border-2 border-white shadow-sm">
                    <div class="flex-1 min-w-0">
                        <h2 id="my-name" class="font-black text-slate-800 truncate text-right">جاري التحميل...</h2>
                        <div class="flex items-center gap-2 justify-end mt-1">
                            <span class="px-2 py-0.5 bg-amber-500 text-white text-[10px] font-bold rounded-lg">
                                <i class="fa-solid fa-coins ml-1"></i><span id="my-coins">0</span>
                            </span>
                            <span id="my-status-label" class="text-[10px] font-bold text-indigo-500 uppercase">Free Member</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- التابات -->
            <div class="flex border-b">
                <div id="tab-direct" class="nav-tab active" onclick="switchTab('direct')">الأصدقاء</div>
                <div id="tab-groups" class="nav-tab" onclick="switchTab('groups')">المجموعات</div>
            </div>

            <!-- قوائم البحث والمستخدمين -->
            <div class="flex-1 overflow-y-auto custom-scroll" id="sidebar-list">
                <div id="users-list" class="divide-y divide-slate-50"></div>
                <div id="groups-list" class="hidden p-8 text-center text-slate-400 text-sm italic">قريباً: إنشاء غرف دردشة جماعية</div>
            </div>

            <div class="p-4 border-t">
                <button onclick="signOutUser()" class="w-full p-3 flex items-center justify-center gap-2 text-red-500 font-bold bg-red-50 rounded-xl hover:bg-red-100 transition">
                    <i class="fa-solid fa-power-off"></i>
                    <span>تسجيل الخروج</span>
                </button>
            </div>
        </aside>

        <!-- منطقة الدردشة -->
        <main class="flex-1 flex flex-col bg-white relative">
            <!-- شاشة الترحيب -->
            <div id="chat-welcome" class="absolute inset-0 z-10 bg-slate-50 flex flex-col items-center justify-center text-center p-8">
                <div class="w-24 h-24 bg-white rounded-[2rem] shadow-xl flex items-center justify-center text-indigo-500 text-4xl mb-6">
                    <i class="fa-solid fa-comments"></i>
                </div>
                <h2 class="text-2xl font-black text-slate-800">أهلاً بك في KimoUp</h2>
                <p class="text-slate-500 mt-2 max-w-xs font-medium">اختر صديقاً من القائمة الجانبية لبدء المحادثة معه فوراً</p>
                <button onclick="toggleSidebar()" class="md:hidden mt-6 px-8 py-3 kimo-gradient text-white rounded-xl font-bold">عرض الأصدقاء</button>
            </div>

            <!-- واجهة المحادثة النشطة -->
            <div id="chat-active" class="hidden h-full flex flex-col relative">
                <header class="p-4 border-b flex items-center justify-between px-6 bg-white/80 backdrop-blur-md sticky top-0 z-20">
                    <div class="flex items-center gap-3">
                        <button onclick="toggleSidebar()" class="md:hidden w-10 h-10 bg-slate-100 rounded-xl flex items-center justify-center text-slate-500">
                            <i class="fa-solid fa-bars"></i>
                        </button>
                        <img id="chat-target-avatar" src="" class="w-10 h-10 rounded-xl object-cover">
                        <div>
                            <h3 id="chat-target-name" class="font-bold text-slate-800 leading-none">...</h3>
                            <span class="text-[10px] text-green-500 font-bold">متصل الآن</span>
                        </div>
                    </div>
                </header>

                <div id="chat-messages" class="flex-1 p-6 overflow-y-auto flex flex-col custom-scroll bg-slate-50/50"></div>

                <footer class="p-4 bg-white border-t">
                    <div class="flex items-center gap-3 max-w-4xl mx-auto">
                        <div class="flex-1 relative">
                            <input type="text" id="msg-input" placeholder="اكتب رسالتك..." class="w-full p-4 pr-12 bg-slate-100 border-none rounded-2xl outline-none focus:ring-2 ring-indigo-500 text-sm">
                            <button class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"><i class="fa-solid fa-face-smile"></i></button>
                        </div>
                        <button onclick="sendMessage()" class="w-14 h-14 kimo-gradient text-white rounded-2xl shadow-lg flex items-center justify-center hover:scale-105 active:scale-95 transition-all">
                            <i class="fa-solid fa-paper-plane text-xl"></i>
                        </button>
                    </div>
                </footer>
            </div>
        </main>
    </div>

    <!-- المودالات (Modals) -->
    
    <!-- مودال الإعدادات -->
    <div id="modal-settings" class="hidden fixed inset-0 bg-slate-900/60 z-[200] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-[2rem] w-full max-w-md shadow-2xl overflow-hidden p-6 relative">
            <button onclick="closeModal('modal-settings')" class="absolute top-4 left-4 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            <h2 class="text-xl font-black mb-6 text-right">إعدادات الحساب</h2>
            
            <div class="flex flex-col items-center mb-6">
                <div class="relative group cursor-pointer" onclick="document.getElementById('file-input').click()">
                    <img id="edit-preview" src="" class="w-24 h-24 rounded-3xl object-cover border-4 border-slate-50 shadow-md">
                    <div class="absolute inset-0 bg-black/30 rounded-3xl opacity-0 group-hover:opacity-100 flex items-center justify-center text-white transition-opacity">
                        <i class="fa-solid fa-camera"></i>
                    </div>
                </div>
                <input type="file" id="file-input" class="hidden" accept="image/*" onchange="previewImage(this)">
            </div>

            <div class="space-y-4">
                <input type="text" id="edit-name" placeholder="الاسم المستعار" class="w-full p-4 bg-slate-50 rounded-2xl outline-none border-none text-right font-bold">
                <textarea id="edit-bio" placeholder="نبذة عنك..." class="w-full p-4 bg-slate-50 rounded-2xl outline-none border-none text-right h-24 resize-none"></textarea>
                <button onclick="saveProfile()" class="w-full py-4 kimo-gradient text-white rounded-2xl font-bold shadow-lg">حفظ التغييرات</button>
            </div>
        </div>
    </div>

    <!-- لوحة المالك -->
    <div id="modal-admin" class="hidden fixed inset-0 bg-slate-900/60 z-[200] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-[2rem] w-full max-w-md shadow-2xl overflow-hidden border-t-8 border-amber-400 p-6">
            <div class="flex justify-between items-center mb-6">
                <button onclick="closeModal('modal-admin')" class="text-slate-400"><i class="fa-solid fa-xmark text-xl"></i></button>
                <h2 class="text-xl font-black flex items-center gap-2">
                    <span>لوحة التحكم</span>
                    <i class="fa-solid fa-crown text-amber-500"></i>
                </h2>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-bold text-slate-400 mr-2">بريد المستخدم المستهدف</label>
                    <input type="email" id="admin-target-email" placeholder="example@mail.com" class="w-full p-4 bg-slate-50 rounded-2xl outline-none border-none text-right">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" id="admin-coins-amount" placeholder="عدد العملات" class="p-4 bg-slate-50 rounded-2xl outline-none border-none text-center font-bold">
                    <button onclick="adminAction('coins')" class="bg-amber-400 text-white font-bold rounded-2xl hover:bg-amber-500 transition">شحن X</button>
                </div>
                <button onclick="adminAction('premium')" class="w-full py-4 bg-slate-800 text-amber-400 rounded-2xl font-black shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-gem"></i>
                    <span>تفعيل / إلغاء بريميوم</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, signInWithCustomToken, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, query, orderBy, onSnapshot, addDoc, serverTimestamp, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // إعدادات البيئة
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'kimo-up-id';

        let userData = null;
        let activeChat = null;
        let chatUnsubscribe = null;
        let base64Image = null;

        // المصادقة التلقائية للبيئة
        const initAuth = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            }
        };
        initAuth();

        // مراقبة حالة المستخدم
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'data');
                const userSnap = await getDoc(userRef);

                if (!userSnap.exists()) {
                    // مستخدم جديد
                    const freshData = {
                        uid: user.uid,
                        email: user.email,
                        name: user.displayName || user.email.split('@')[0],
                        avatar: `https://ui-avatars.com/api/?name=${user.email.split('@')[0]}&background=random`,
                        xCoins: 100,
                        isPremium: false,
                        bio: "أنا استخدم كيمو أب!",
                        createdAt: serverTimestamp()
                    };
                    await setDoc(userRef, freshData);
                    
                    // التسجيل في الدليل العام للبحث
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'directory', user.uid), {
                        uid: user.uid,
                        email: user.email,
                        name: freshData.name,
                        avatar: freshData.avatar
                    });
                }

                // استماع لحظي لبياناتي
                onSnapshot(userRef, (snap) => {
                    userData = snap.data();
                    updateMyUI();
                    document.getElementById('loader').classList.add('hidden');
                    document.getElementById('auth-screen').classList.add('hidden');
                    document.getElementById('main-app').classList.remove('hidden');
                });

                loadUsers();
            } else {
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('main-app').classList.add('hidden');
                document.getElementById('auth-screen').classList.remove('hidden');
            }
        });

        // تحديث الواجهة الخاصة بي
        function updateMyUI() {
            document.getElementById('my-name').innerText = userData.name;
            document.getElementById('my-coins').innerText = userData.xCoins || 0;
            document.getElementById('my-avatar').src = userData.avatar;
            document.getElementById('edit-preview').src = userData.avatar;
            document.getElementById('my-status-label').innerText = userData.isPremium ? "Premium Member" : "Free Member";
            
            if (userData.email === "kareemwael0216@gmail.com") {
                document.getElementById('admin-trigger').classList.remove('hidden');
            }
        }

        // التعامل مع الدخول / التسجيل
        window.handleAuth = async (type) => {
            const email = document.getElementById('auth-email').value.trim();
            const pass = document.getElementById('auth-pass').value;
            if(!email || pass.length < 6) return showToast("بيانات غير صالحة", "error");

            try {
                if(type === 'login') await signInWithEmailAndPassword(auth, email, pass);
                else await createUserWithEmailAndPassword(auth, email, pass);
            } catch (e) {
                showToast("خطأ في المصادقة", "error");
            }
        };

        window.signOutUser = () => signOut(auth);

        // تحميل قائمة المستخدمين
        function loadUsers() {
            const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'directory'));
            onSnapshot(q, (snap) => {
                const list = document.getElementById('users-list');
                list.innerHTML = "";
                snap.forEach(doc => {
                    const u = doc.data();
                    if(u.uid === auth.currentUser.uid) return;
                    
                    const el = document.createElement('div');
                    el.className = "p-4 flex items-center gap-3 hover:bg-indigo-50 cursor-pointer transition";
                    el.onclick = () => startChat(u);
                    el.innerHTML = `
                        <img src="${u.avatar}" class="w-12 h-12 rounded-xl object-cover shadow-sm">
                        <div class="flex-1 overflow-hidden">
                            <p class="font-bold text-slate-800 truncate">${u.name}</p>
                            <p class="text-[10px] text-slate-400 truncate">${u.email}</p>
                        </div>
                    `;
                    list.appendChild(el);
                });
            }, (err) => console.error("Error loading users", err));
        }

        // بدء دردشة
        window.startChat = (target) => {
            activeChat = target;
            const chatId = [auth.currentUser.uid, target.uid].sort().join('_');
            
            document.getElementById('chat-welcome').classList.add('hidden');
            document.getElementById('chat-active').classList.remove('hidden');
            document.getElementById('chat-target-name').innerText = target.name;
            document.getElementById('chat-target-avatar').src = target.avatar;
            
            if(window.innerWidth < 768) toggleSidebar();
            
            loadMessages(chatId);
        };

        function loadMessages(chatId) {
            if(chatUnsubscribe) chatUnsubscribe();
            
            const msgRef = collection(db, 'artifacts', appId, 'public', 'data', 'chats', chatId, 'messages');
            const q = query(msgRef, orderBy('createdAt', 'asc'));
            
            chatUnsubscribe = onSnapshot(q, (snap) => {
                const box = document.getElementById('chat-messages');
                box.innerHTML = "";
                snap.forEach(doc => {
                    const m = doc.data();
                    const isMe = m.senderId === auth.currentUser.uid;
                    const div = document.createElement('div');
                    div.className = `msg-bubble ${isMe ? 'msg-me' : 'msg-them'}`;
                    div.innerHTML = `
                        <div>${m.text}</div>
                        <div class="text-[8px] mt-1 opacity-50 text-left">${m.createdAt ? new Date(m.createdAt.toDate()).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '...'}</div>
                    `;
                    box.appendChild(div);
                });
                box.scrollTop = box.scrollHeight;
            }, (err) => showToast("خطأ في مزامنة الرسائل", "error"));
        }

        window.sendMessage = async () => {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if(!text || !activeChat) return;
            
            const chatId = [auth.currentUser.uid, activeChat.uid].sort().join('_');
            input.value = "";
            
            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'chats', chatId, 'messages'), {
                    senderId: auth.currentUser.uid,
                    text: text,
                    createdAt: serverTimestamp()
                });
            } catch (e) {
                showToast("فشل الإرسال", "error");
            }
        };

        // تعديل البروفايل
        window.previewImage = (input) => {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    base64Image = e.target.result;
                    document.getElementById('edit-preview').src = base64Image;
                };
                reader.readAsDataURL(input.files[0]);
            }
        };

        window.saveProfile = async () => {
            const newName = document.getElementById('edit-name').value.trim();
            const newBio = document.getElementById('edit-bio').value.trim();
            if(!newName) return showToast("الاسم مطلوب", "error");

            try {
                const updates = { name: newName, bio: newBio };
                if(base64Image) updates.avatar = base64Image;
                
                await updateDoc(doc(db, 'artifacts', appId, 'users', auth.currentUser.uid, 'profile', 'data'), updates);
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'directory', auth.currentUser.uid), {
                    name: newName,
                    avatar: base64Image || userData.avatar
                });
                
                showToast("تم الحفظ بنجاح", "success");
                closeModal('modal-settings');
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            } catch (e) {
                showToast("حدث خطأ أثناء الحفظ", "error");
            }
        };

        // إدارة المالك
        window.adminAction = async (type) => {
            const email = document.getElementById('admin-target-email').value.trim();
            if(!email) return showToast("أدخل إيميل صحيح", "error");

            // البحث عن UID المستخدم من الإيميل عبر الدليل العام
            const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'directory'), where("email", "==", email));
            const snap = await getDoc(q); // تنبيه: getDoc لا تعمل مع query مباشرة، نستخدم getDocs
            
            // تصحيح: للحصول على وثيقة من بحث
            const searchSnap = await onSnapshot(q, async (s) => {
                if(s.empty) return showToast("المستخدم غير موجود", "error");
                const targetUid = s.docs[0].data().uid;
                const ref = doc(db, 'artifacts', appId, 'users', targetUid, 'profile', 'data');
                const pSnap = await getDoc(ref);
                
                if(type === 'coins') {
                    const val = parseInt(document.getElementById('admin-coins-amount').value) || 0;
                    await updateDoc(ref, { xCoins: (pSnap.data().xCoins || 0) + val });
                    showToast(`تم شحن ${val} عملة`, "success");
                } else {
                    const status = pSnap.data().isPremium || false;
                    await updateDoc(ref, { isPremium: !status });
                    showToast(status ? "تم إلغاء البريميوم" : "تم منح البريميوم", "success");
                }
            });
        };

        // أدوات التحكم في الواجهة
        window.toggleSidebar = () => {
            const side = document.getElementById('sidebar');
            const over = document.getElementById('overlay');
            side.classList.toggle('open');
            over.classList.toggle('active');
        };

        window.switchTab = (tab) => {
            document.getElementById('tab-direct').classList.toggle('active', tab === 'direct');
            document.getElementById('tab-groups').classList.toggle('active', tab === 'groups');
            document.getElementById('users-list').classList.toggle('hidden', tab !== 'direct');
            document.getElementById('groups-list').classList.toggle('hidden', tab !== 'groups');
        };

        window.openModal = (id) => {
            document.getElementById(id).classList.remove('hidden');
            if(id === 'modal-settings') {
                document.getElementById('edit-name').value = userData.name;
                document.getElementById('edit-bio').value = userData.bio || "";
            }
        };

        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');

        function showToast(msg, type = "info") {
            const box = document.getElementById('toast-box');
            const t = document.createElement('div');
            const bg = type === 'success' ? 'bg-green-500' : type === 'error' ? 'bg-red-500' : 'bg-indigo-600';
            t.className = `${bg} text-white px-6 py-3 rounded-2xl shadow-xl font-bold flex items-center gap-2 animate-bounce-in`;
            t.innerHTML = `<span>${msg}</span>`;
            box.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

    </script>
</body>
</html>
