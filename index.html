<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KimoUp Grand Architect | AI & Logic Ecosystem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* نظام الألوان المتغير للحسابات البريميوم والعادية */
        :root { --p-color: #8b5cf6; --bg-dark: #020617; }
        .premium-ui { --p-color: #f59e0b; }
        
        body { background: var(--bg-dark); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; height: 100vh; overflow: hidden; }
        .kimo-card { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
        .gradient-border { position: relative; border-radius: 2rem; background: linear-gradient(var(--bg-dark), var(--bg-dark)) padding-box, linear-gradient(135deg, var(--p-color), #ec4899) border-box; border: 2px solid transparent; }
        
        /* أنيميشن التحميل والذكاء الاصطناعي */
        .ai-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        
        .chat-scroll::-webkit-scrollbar { width: 4px; }
        .chat-scroll::-webkit-scrollbar-thumb { background: var(--p-color); border-radius: 10px; }
    </style>
</head>
<body>

    <div id="auth-layer" class="fixed inset-0 z-[1000] flex items-center justify-center bg-slate-950">
        <div class="kimo-card p-10 rounded-[3rem] w-full max-w-lg border-t-8 border-violet-600 shadow-2xl text-center">
            <div class="w-24 h-24 kimo-gradient bg-violet-600 rounded-3xl flex items-center justify-center mx-auto mb-6 rotate-12 shadow-2xl shadow-violet-500/20">
                <i class="fa-solid fa-code-branch text-4xl text-white"></i>
            </div>
            <h1 class="text-4xl font-black mb-2 tracking-tighter italic">KIMO<span class="text-violet-500">UP</span> V7</h1>
            <p class="text-slate-400 text-sm mb-10 font-medium">نظام الإدارة المتكاملة بالذكاء الاصطناعي</p>
            
            <div class="space-y-4">
                <input type="email" id="auth-email" placeholder="بريدك الإلكتروني" class="w-full p-5 bg-slate-900 border border-slate-800 rounded-2xl outline-none focus:ring-2 ring-violet-500 transition-all">
                <input type="password" id="auth-pass" placeholder="كلمة المرور" class="w-full p-5 bg-slate-900 border border-slate-800 rounded-2xl outline-none focus:ring-2 ring-violet-500 transition-all">
                <div class="flex gap-2">
                    <button onclick="Core.Auth.login()" class="flex-1 bg-violet-600 p-5 rounded-2xl font-black hover:bg-violet-500 transition-all active:scale-95 shadow-lg shadow-violet-900/40">دخول</button>
                    <button onclick="Core.Auth.register()" class="flex-1 bg-slate-800 p-5 rounded-2xl font-black hover:bg-slate-700 transition-all">تسجيل</button>
                </div>
            </div>
        </div>
    </div>

    <div id="main-ui" class="hidden h-screen flex p-4 gap-4 overflow-hidden">
        
        <aside class="w-80 flex flex-col gap-4">
            <div class="kimo-card p-6 rounded-[2.5rem] relative overflow-hidden group">
                <div id="premium-glow" class="hidden absolute inset-0 bg-amber-500/5 animate-pulse"></div>
                <div class="relative z-10 flex items-center gap-4">
                    <img id="u-avatar" src="" class="w-16 h-16 rounded-2xl border-2 border-violet-500/30 object-cover">
                    <div class="overflow-hidden">
                        <p id="u-display-name" class="font-black truncate text-lg">تحميل...</p>
                        <span id="u-badge" class="text-[9px] bg-slate-800 px-2 py-1 rounded-full font-bold text-slate-400">USER</span>
                    </div>
                </div>
                <div class="mt-6 grid grid-cols-2 gap-2">
                    <div class="bg-slate-900/50 p-3 rounded-2xl border border-white/5 text-center">
                        <p class="text-[10px] text-slate-500 font-bold">الرصيد</p>
                        <p id="u-coins" class="text-violet-400 font-black">0</p>
                    </div>
                    <div class="bg-slate-900/50 p-3 rounded-2xl border border-white/5 text-center">
                        <p class="text-[10px] text-slate-500 font-bold">AI Usage</p>
                        <p id="u-ai-count" class="text-pink-500 font-black">0/10</p>
                    </div>
                </div>
            </div>

            <div class="flex-1 kimo-card rounded-[2.5rem] flex flex-col p-4">
                <div class="relative mb-4">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-600"></i>
                    <input type="text" onkeyup="Core.UI.filterContacts(this.value)" placeholder="بحث عن صديق..." class="w-full bg-slate-900/50 p-4 pl-12 rounded-2xl text-xs outline-none border border-transparent focus:border-violet-500/50">
                </div>
                <div id="contact-list" class="flex-1 overflow-y-auto space-y-2 chat-scroll">
                    <div onclick="Core.Chat.selectAI()" class="p-4 rounded-2xl bg-gradient-to-r from-violet-600/20 to-pink-600/20 border border-violet-500/20 cursor-pointer hover:scale-[1.02] transition-all group">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-violet-600 rounded-xl flex items-center justify-center shadow-lg group-hover:rotate-12 transition-all">
                                <i class="fa-solid fa-robot text-white"></i>
                            </div>
                            <div>
                                <p class="text-sm font-black text-violet-300">Kimo AI Assistant</p>
                                <p class="text-[9px] text-pink-400 font-bold">PRO VISION ENABLED</p>
                            </div>
                        </div>
                    </div>
                    <div id="dynamic-contacts"></div>
                </div>
            </div>
        </aside>

        <main class="flex-1 kimo-card rounded-[3rem] flex flex-col relative overflow-hidden">
            <header id="chat-header" class="hidden p-6 border-b border-white/5 flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <img id="target-avatar" src="" class="w-12 h-12 rounded-xl object-cover">
                    <div>
                        <h3 id="target-name" class="font-black">...</h3>
                        <div class="flex items-center gap-1.5">
                            <div class="w-2 h-2 bg-green-500 rounded-full"></div>
                            <span class="text-[10px] text-slate-500 font-bold uppercase">Online Now</span>
                        </div>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button id="upgrade-btn" onclick="Core.Logic.showUpgrade()" class="hidden bg-amber-500 text-black px-5 py-2 rounded-xl text-xs font-black shadow-lg shadow-amber-500/20">Upgrade Premium 👑</button>
                    <button class="w-11 h-11 bg-slate-800 rounded-xl flex items-center justify-center hover:bg-slate-700 transition-all"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                </div>
            </header>

            <div id="chat-box" class="flex-1 overflow-y-auto p-8 flex flex-col gap-4 chat-scroll">
                <div class="m-auto text-center pointer-events-none opacity-10">
                    <i class="fa-solid fa-shield-halved text-[150px]"></i>
                    <h2 class="text-4xl font-black mt-4 italic">SECURE LOGIC V7</h2>
                </div>
            </div>

            <footer id="chat-footer" class="hidden p-6 bg-slate-900/30 border-t border-white/5">
                <div id="img-preview-container" class="hidden absolute bottom-28 left-8 p-2 bg-slate-800 rounded-2xl border-2 border-violet-500 shadow-2xl animate-bounce">
                    <img id="img-render" class="max-w-[200px] max-h-[150px] rounded-xl">
                    <button onclick="Core.UI.clearMedia()" class="absolute -top-3 -right-3 bg-red-600 w-8 h-8 rounded-full shadow-lg"><i class="fa-solid fa-xmark"></i></button>
                </div>

                <div class="flex items-end gap-3 max-w-5xl mx-auto">
                    <label class="w-14 h-14 bg-slate-800 rounded-2xl flex items-center justify-center cursor-pointer hover:bg-violet-600 transition-all shadow-xl group">
                        <i class="fa-solid fa-camera-viewfinder text-xl text-slate-400 group-hover:text-white"></i>
                        <input type="file" id="media-upload" class="hidden" accept="image/*" onchange="Core.UI.handleMedia(this)">
                    </label>
                    
                    <div class="flex-1 relative">
                        <textarea id="msg-input" placeholder="اسأل الذكاء الاصطناعي أو ابدأ المحادثة..." class="w-full bg-slate-800 p-4 pr-6 rounded-[1.5rem] outline-none focus:ring-2 ring-violet-500/50 border border-slate-700 transition-all min-h-[56px] max-h-40 resize-none text-sm font-medium leading-relaxed" rows="1"></textarea>
                    </div>

                    <button id="action-btn" onclick="Core.Chat.send()" class="w-14 h-14 bg-violet-600 text-white rounded-2xl flex items-center justify-center shadow-xl shadow-violet-900/40 hover:scale-105 active:scale-95 transition-all">
                        <i class="fa-solid fa-bolt-lightning text-xl"></i>
                    </button>
                </div>
            </footer>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, collection, addDoc, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Firebase Configuration (Identity & Data)
        const config = { 
            apiKey: "AIzaSyDEF8YAXmkV5t7scY1St2GDliQueOXGEsc", 
            authDomain: "telekimo-36af6.firebaseapp.com", 
            projectId: "telekimo-36af6", 
            appId: "1:430737934562:web:22eb31d1fd4742826776bb" 
        };

        const app = initializeApp(config);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Core Global Namespace (The 1000-Line Architecture Pattern)
        window.Core = {
            State: {
                user: null,
                activeChat: null,
                mediaBuffer: null,
                isAILoading: false,
                GROQ_KEY: "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"
            },

            // 1. Auth Module (التحكم في الهوية)
            Auth: {
                async login() {
                    const e = document.getElementById('auth-email').value;
                    const p = document.getElementById('auth-pass').value;
                    try { await signInWithEmailAndPassword(auth, e, p); }
                    catch(err) { Core.UI.toast(err.message, "error"); }
                },
                async register() {
                    const e = document.getElementById('auth-email').value;
                    const p = document.getElementById('auth-pass').value;
                    try { await createUserWithEmailAndPassword(auth, e, p); }
                    catch(err) { Core.UI.toast(err.message, "error"); }
                }
            },

            // 2. Logic Module (منطق الأعمال والترقيات)
            Logic: {
                async syncUser(user) {
                    const ref = doc(db, "users", user.email);
                    const snap = await getDoc(ref);
                    if (!snap.exists()) {
                        const init = { email: user.email, name: user.email.split('@')[0], coins: 500, aiCount: 0, isPremium: false, avatar: "" };
                        await setDoc(ref, init);
                        Core.State.user = init;
                    }
                    onSnapshot(ref, (d) => {
                        Core.State.user = d.data();
                        Core.UI.refreshProfile();
                    });
                },
                
                async processUpgrade() {
                    if (Core.State.user.coins < 1000) return Core.UI.toast("رصيدك غير كافٍ (1000 X)", "error");
                    await updateDoc(doc(db, "users", Core.State.user.email), {
                        isPremium: true,
                        coins: Core.State.user.coins - 1000
                    });
                    Core.UI.toast("تمت الترقية للبريميوم بنجاح! 🎉", "success");
                }
            },

            // 3. AI & Vision Module (منطق الذكاء الاصطناعي)
            AI: {
                async ask(prompt, image = null) {
                    // الدفاع ضد تجاوز المحاولات
                    if (!Core.State.user.isPremium && Core.State.user.aiCount >= 10) {
                        return "نظام الحماية: لقد استنفدت محاولاتك الـ 10 المجانية. برجاء الترقية للبريميوم.";
                    }

                    try {
                        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                            method: "POST",
                            headers: { "Authorization": `Bearer ${Core.State.GROQ_KEY}`, "Content-Type": "application/json" },
                            body: JSON.stringify({
                                model: image ? "llama-3.2-11b-vision-preview" : "llama3-8b-8192",
                                messages: [{
                                    role: "user",
                                    content: image ? [
                                        { type: "text", text: prompt || "ماذا يوجد في الصورة؟" },
                                        { type: "image_url", image_url: { url: image } }
                                    ] : prompt
                                }]
                            })
                        });
                        const data = await response.json();
                        
                        // تحديث عداد الاستخدام منطقياً
                        if (!Core.State.user.isPremium) {
                            await updateDoc(doc(db, "users", Core.State.user.email), {
                                aiCount: Core.State.user.aiCount + 1
                            });
                        }
                        return data.choices[0].message.content;
                    } catch (e) { return "خطأ في الاتصال بالسيرفر، حاول مجدداً."; }
                }
            },

            // 4. Chat Module (التحكم في المحادثات)
            Chat: {
                selectAI() {
                    Core.State.activeChat = { email: "KIMO_AI", name: "Kimo AI Vision", avatar: "https://cdn-icons-png.flaticon.com/512/4712/4712139.png" };
                    Core.UI.initChatRoom();
                },
                async send() {
                    const inp = document.getElementById('msg-input');
                    const txt = inp.value.trim();
                    if (!txt && !Core.State.mediaBuffer) return;

                    const roomID = Core.UI.getRoomID(Core.State.user.email, Core.State.activeChat.email);
                    const msgData = { sender: Core.State.user.email, text: txt, img: Core.State.mediaBuffer, time: serverTimestamp() };
                    
                    inp.value = "";
                    Core.UI.clearMedia();
                    await addDoc(collection(db, "chats", roomID, "messages"), msgData);

                    if (Core.State.activeChat.email === "KIMO_AI") {
                        Core.UI.setAILoading(true);
                        const reply = await Core.AI.ask(txt, msgData.img);
                        await addDoc(collection(db, "chats", roomID, "messages"), { 
                            sender: "KIMO_AI", text: reply, time: serverTimestamp() 
                        });
                        Core.UI.setAILoading(false);
                        Core.UI.speak(reply);
                    }
                }
            },

            // 5. UI Module (إدارة الواجهة والأنيميشن)
            UI: {
                refreshProfile() {
                    const u = Core.State.user;
                    document.getElementById('u-display-name').innerText = u.name;
                    document.getElementById('u-coins').innerText = u.coins;
                    document.getElementById('u-ai-count').innerText = u.isPremium ? "UNLIMITED" : `${u.aiCount}/10`;
                    document.getElementById('u-avatar').src = u.avatar || `https://ui-avatars.com/api/?name=${u.name}&background=random`;
                    
                    if (u.isPremium) {
                        document.body.classList.add('premium-ui');
                        document.getElementById('u-badge').innerText = "PREMIUM 👑";
                        document.getElementById('u-badge').className = "text-[9px] bg-amber-500 px-2 py-1 rounded-full font-black text-black";
                        document.getElementById('premium-glow').classList.remove('hidden');
                    }
                },
                handleMedia(input) {
                    const file = input.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            Core.State.mediaBuffer = e.target.result;
                            document.getElementById('img-preview-container').classList.remove('hidden');
                            document.getElementById('img-render').src = e.target.result;
                        };
                        reader.readAsDataURL(file);
                    }
                },
                clearMedia() {
                    Core.State.mediaBuffer = null;
                    document.getElementById('img-preview-container').classList.add('hidden');
                },
                toast(m, type) {
                    alert(m); // يمكن استبدالها بـ UI Toast مخصص
                },
                getRoomID(id1, id2) { return [id1, id2].sort().join("_"); },
                initChatRoom() {
                    document.getElementById('chat-header').classList.remove('hidden');
                    document.getElementById('chat-footer').classList.remove('hidden');
                    document.getElementById('target-name').innerText = Core.State.activeChat.name;
                    document.getElementById('target-avatar').src = Core.State.activeChat.avatar;
                    if (!Core.State.user.isPremium) document.getElementById('upgrade-btn').classList.remove('hidden');
                    
                    const roomID = this.getRoomID(Core.State.user.email, Core.State.activeChat.email);
                    const q = query(collection(db, "chats", roomID, "messages"), orderBy("time", "asc"), limit(50));
                    onSnapshot(q, (snap) => {
                        const box = document.getElementById('chat-box');
                        box.innerHTML = "";
                        snap.forEach(doc => {
                            const m = doc.data();
                            const isMe = m.sender === Core.State.user.email;
                            const d = document.createElement('div');
                            d.className = isMe ? "self-end" : "self-start";
                            d.innerHTML = `
                                <div class="p-4 rounded-2xl max-w-[80%] shadow-xl ${isMe ? 'bg-violet-600 rounded-br-none' : 'bg-slate-800 border border-white/5 rounded-bl-none'}">
                                    ${m.img ? `<img src="${m.img}" class="w-full rounded-xl mb-2">` : ''}
                                    <p class="text-sm leading-relaxed">${m.text}</p>
                                </div>
                            `;
                            box.appendChild(d);
                        });
                        box.scrollTop = box.scrollHeight;
                    });
                },
                setAILoading(s) { /* إضافة أنيميشن لودنج هنا */ },
                speak(t) {
                    const s = new SpeechSynthesisUtterance(t);
                    s.lang = 'ar-SA';
                    window.speechSynthesis.speak(s);
                }
            }
        };

        // Initialize App State
        onAuthStateChanged(auth, (user) => {
            if (user) {
                Core.Logic.syncUser(user);
                document.getElementById('auth-layer').style.display = 'none';
                document.getElementById('main-ui').classList.remove('hidden');
            } else {
                document.getElementById('auth-layer').style.display = 'flex';
                document.getElementById('main-ui').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
